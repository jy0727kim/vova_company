<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="업무 영어">
<title>업무 영어</title>
<style>
/* ===== 색상 (밝은 화면 / 어두운 화면) ===== */
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1f2328; --sub:#667085; --line:#e4e7ec;
  --accent:#2563eb; --accent-soft:#e8efff;
  --ok:#16a34a; --ok-soft:#e7f6ec; --no:#dc2626; --no-soft:#fdecec; --mark:#fff3bf;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --card:#181b21; --text:#e6e8eb; --sub:#9aa3af; --line:#2a2f37;
    --accent:#6b9bff; --accent-soft:#1d2840;
    --ok:#4ade80; --ok-soft:#15281c; --no:#f87171; --no-soft:#2e1717; --mark:#4a3f12;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 6px;max-width:640px;margin:0 auto;display:flex;align-items:baseline;gap:8px}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0 0 8px}
h3{font-size:15px;margin:0 0 6px}
.ver{color:var(--sub);font-size:12px}
main{max-width:640px;margin:0 auto;padding:0 16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
label.f{display:block;margin:14px 0 0}
label.f>span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.fhint{font-size:12px;color:var(--sub);margin-top:4px}
input,textarea,select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}

button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer;display:inline-block}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--accent);color:#fff;border-color:var(--accent);width:100%;padding:13px;font-weight:600;margin-top:16px}
.row{display:flex;gap:8px;margin-top:12px}
.row>*{flex:1;text-align:center}
.okbtn{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:600}
.nobtn{background:var(--no-soft);color:var(--no);border-color:transparent;font-weight:600}
.danger{color:var(--no)}
.armed{background:var(--no);color:#fff;border-color:var(--no)}
.link{border:0;background:none;color:var(--sub);padding:4px 0;text-decoration:underline}
.small{padding:6px 12px;font-size:14px}

/* 두세 개 중 고르는 버튼 묶음 */
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px}
.seg button.on{background:var(--card);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg.sub{margin-top:10px}
.seg.sub button{font-size:14px;padding:6px}

/* 아래쪽 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:16px 0;color:var(--sub);font-weight:600}
.tabs button.on{color:var(--accent)}

.msg{margin:12px 0 0;padding:10px 12px;border-radius:10px;font-size:14px}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.err{background:var(--no-soft);color:var(--no)}
.msg.info{background:var(--accent-soft);color:var(--accent)}
.hint{font-size:13px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.searchrow{display:flex;gap:8px;margin-top:14px}
.searchrow input{flex:1}
.searchrow button{flex:none;background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}

/* 단어 사전 화면 (원래 단어장의 찾기 결과 화면) */
.hw{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hw .word{font-size:22px;font-weight:700;word-break:break-word}
.ipa{color:var(--sub);font-size:14px}
.posh{margin:14px 0 4px;font-size:12px;font-weight:700;color:var(--accent)}
.sn{display:flex;gap:8px;margin:6px 0}
.sn .no{color:var(--sub);min-width:18px}
.sb{flex:1;min-width:0}
.smain{font-weight:600}
.sdef{font-size:13px;color:var(--sub)}
.ex2{margin-top:4px;padding:6px 10px;background:var(--bg);border-radius:8px;font-size:14px}
.ex2 .k{color:var(--sub);font-size:13px;margin-top:2px}
.spk,.pill button{border:0;background:none;padding:2px 6px;font-size:16px;border-radius:6px}
.pill{display:inline-flex;gap:2px;vertical-align:middle}
.pill button.on{background:var(--accent-soft)}
.src{font-size:12px;color:var(--sub);margin-top:10px}
.thumb{display:block;max-width:100%;max-height:220px;border-radius:10px;margin-top:10px}
.brow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.brow .bi{flex:1;min-width:0}
.brow .bw{font-weight:700}
.sense{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}

/* 목록 */
.toolbar{margin-top:12px;display:grid;gap:8px}
.count{font-size:13px;color:var(--sub);margin:12px 0 0}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.item .top{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.word{background:var(--ok-soft);color:var(--ok)}
.en{font-size:17px;font-weight:600;margin:6px 0 2px;word-break:break-word}
.ko{margin:0;color:var(--text)}
.memo{margin:4px 0 0;font-size:13px;color:var(--sub)}
.meta{margin:8px 0 0;font-size:12px;color:var(--sub)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.actions button{padding:6px 12px;font-size:14px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.tip{margin:8px 0 0;font-size:13px;color:var(--sub);background:var(--bg);border-radius:8px;padding:6px 10px}

/* 복습 */
.big{font-size:34px;font-weight:700;margin:4px 0}
.bar{height:8px;background:var(--bg);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.runhead{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px;color:var(--sub)}
.qlabel{font-size:13px;color:var(--sub);margin:0 0 8px}
.qtext{font-size:20px;font-weight:600;margin:0 0 8px;word-break:break-word}
.qhint{color:var(--sub);margin:0}
.blank{display:inline-block;border-bottom:2px solid var(--accent);min-width:3ch;color:transparent;margin:0 2px}
.banner{padding:10px 12px;border-radius:10px;font-weight:700;margin-bottom:12px}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.no{background:var(--no-soft);color:var(--no)}
.answer{margin:6px 0}
.answer b{color:var(--sub);font-weight:500;font-size:13px;display:block}
.autobtn{width:100%;margin-top:8px;background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
</style>
</head>
<body>
<header><h1>업무 영어</h1><span class="ver">v4</span><span class="ver" id="syncStat" style="margin-left:auto"></span></header>
<main id="app"></main>
<nav class="tabs">
  <button data-tab="add">추가</button>
  <button data-tab="list">목록</button>
  <button data-tab="review">복습</button>
</nav>

<script>
(function () {
  'use strict';

  // ===== 저장 이름표 (브라우저 안에 저장할 때 쓰는 이름) =====
  var LS_ITEMS = 'be_items_v1';
  var LS_SETTINGS = 'be_settings_v1';
  // 맞힐 때마다 다음 복습까지 기다리는 날 수 (1일 → 2일 → 4일 ...)
  var INTERVALS = [1, 2, 4, 7, 15, 30];

  // ===== 작은 도우미 함수들 =====
  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function store(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  // 오늘 날짜 문자열 (offset 만큼 날짜를 더함)
  function dayStr(offset) {
    var d = new Date();
    d.setDate(d.getDate() + (offset || 0));
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  // 화면에 글자를 안전하게 넣기 (<, > 같은 기호가 코드로 실행되지 않게)
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  // 정답 비교용: 대소문자, 마침표·쉼표, 띄어쓰기 차이는 무시
  function norm(s) {
    return String(s || '').toLowerCase()
      .replace(/[’‘`]/g, "'")
      .replace(/[.,!?;:"“”()]/g, '')
      .replace(/\s+/g, ' ').trim();
  }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function str(v) { return String(v == null ? '' : v).trim(); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // 문장 추가 화면의 빈 입력칸
  function emptyForm() { return { en: '', ko: '', key: '', tip: '', memo: '' }; }

  // ===== 앱 상태 (지금 화면에 필요한 모든 정보) =====
  var S = {
    tab: 'add',
    items: load(LS_ITEMS, []),
    settings: Object.assign({ daily: 10, mode: 'mix', doneDate: '', doneCount: 0 }, load(LS_SETTINGS, {})),
    msg: '', msgType: 'ok',
    // 추가 화면
    addType: 'word', wordMode: 'one',
    q: '', loading: false, found: null, foundKo: '', foundMemo: '',          // 단어 한 개씩
    bulkText: '', bulk: { loading: false, prog: '', results: [], bad: [], skipped: 0 }, // 여러 개 한꺼번에
    photoBusy: false, photoUrl: '', photoMode: 'auto',                         // 사진
    form: emptyForm(),                                                         // 문장
    // 목록 화면
    search: '', filter: 'all', open: {}, edit: null, editId: null, delArm: null,
    // 복습
    run: null,
    // Gemini
    gemKey: '', gemQuality: false, gemBusy: false, gemResult: '', gemOK: false, gemDiag: '', gemUsed: ''
  };
  try {
    S.gemKey = localStorage.getItem('be_gemkey') || '';
    S.gemQuality = localStorage.getItem('be_gemquality') === '1';
  } catch (e) {}

  // v2까지 저장한 단어를 새 모양(뜻 여러 개)으로 바꿈
  S.items.forEach(function (it) {
    if (it.tip == null) it.tip = '';
    if (it.type === 'word' && !Array.isArray(it.senses)) {
      it.senses = it.ex ? [{ pos: '', koDef: it.ko || '', en: '', ex: it.ex, exKo: it.exKo || '' }] : [];
      it.ipa = it.ipa || '';
    }
    delete it.ex; delete it.exKo;
    if (!it.updatedAt) it.updatedAt = it.createdAt || 1; // 동기화할 때 "언제 고쳤는지" 비교용
  });

  function persist() {
    if (!store(LS_ITEMS, S.items)) alert('저장 공간이 부족해서 저장하지 못했어. 백업을 먼저 해 줘.');
    scheduleSync();
  }
  // 항목을 고칠 때마다 "고친 시각"을 남김 (기기끼리 합칠 때 더 최근 것이 이김)
  function touch(it) { it.updatedAt = Date.now(); }
  function saveSettings() { store(LS_SETTINGS, S.settings); }
  function getItem(id) {
    for (var i = 0; i < S.items.length; i++) if (S.items[i].id === id) return S.items[i];
    return null;
  }
  // 같은 영어가 이미 있는지 (대소문자·마침표 무시)
  function findSame(en, exceptId) {
    var k = norm(en);
    for (var i = 0; i < S.items.length; i++) if (S.items[i].id !== exceptId && norm(S.items[i].en) === k) return S.items[i];
    return null;
  }
  // 퀴즈와 목록에 나오는 한글 뜻
  function meaning(it) {
    return it.ko || (it.senses && it.senses[0] && (it.senses[0].koDef || it.senses[0].en)) || '(뜻 없음)';
  }
  // 날짜가 바뀌면 오늘 푼 개수를 0으로
  function resetDaily() {
    if (S.settings.doneDate !== dayStr()) {
      S.settings.doneDate = dayStr();
      S.settings.doneCount = 0;
      saveSettings();
    }
  }
  // 오늘까지 복습할 차례가 된 항목 (오래 밀린 것, 많이 틀린 것 먼저)
  function dueItems() {
    var today = dayStr();
    return S.items.filter(function (it) { return it.due <= today; })
      .sort(function (a, b) {
        if (a.due !== b.due) return a.due < b.due ? -1 : 1;
        return b.wrong - a.wrong;
      });
  }

  // 문장에서 가릴 부분 찾기: 핵심 표현이 있으면 그것, 없으면 가장 긴 단어
  function blankInfo(it) {
    var en = it.en, key = it.key || '', i = -1;
    if (key) i = en.toLowerCase().indexOf(key.toLowerCase());
    if (i < 0) {
      var words = en.match(/[A-Za-z][A-Za-z'-]*/g) || [];
      key = words.reduce(function (a, w) { return w.length > a.length ? w : a; }, '');
      if (!key) return { before: '', answer: en, after: '' };
      i = en.indexOf(key);
    }
    return { before: en.slice(0, i), answer: en.substr(i, key.length), after: en.slice(i + key.length) };
  }
  // 단어 힌트: headcount → h________
  function letterHint(en) {
    return en.split(' ').map(function (w) {
      return w.charAt(0) + w.slice(1).replace(/[A-Za-z]/g, '_');
    }).join('  ');
  }
  // 핵심 표현에 형광펜 칠하기
  function highlight(en, key) {
    if (!key) return esc(en);
    var i = en.toLowerCase().indexOf(key.toLowerCase());
    if (i < 0) return esc(en);
    return esc(en.slice(0, i)) + '<mark>' + esc(en.substr(i, key.length)) + '</mark>' + esc(en.slice(i + key.length));
  }

  // ===== 발음 (원래 단어장과 같음: 미국식 기기 음성, 예문 반복 재생) =====
  var canSpeak = typeof window !== 'undefined' && 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  function pickVoice(u) {
    var v = speechSynthesis.getVoices().find(function (x) { return /^en[-_]US$/i.test(x.lang); });
    if (v) u.voice = v;
  }
  function speak(text) {
    if (!canSpeak || !text) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.9; pickVoice(u);
      speechSynthesis.speak(u);
    } catch (e) { /* 소리가 안 나도 앱은 계속 */ }
  }
  if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }
  var loopKey = null;
  function stopLoop() {
    loopKey = null;
    try { if (canSpeak) speechSynthesis.cancel(); } catch (e) {}
    var on = document.querySelectorAll('.pill .on');
    for (var i = 0; i < on.length; i++) on[i].classList.remove('on');
  }
  // 예문을 계속 반복해서 읽어주기 (최대 20번)
  function toggleLoop(text, btn) {
    if (!canSpeak || !text) return;
    if (loopKey === text) { stopLoop(); return; }
    stopLoop();
    loopKey = text;
    if (btn) btn.classList.add('on');
    var count = 0;
    (function again() {
      if (loopKey !== text) return;
      if (count >= 20) { stopLoop(); return; }
      count++;
      try {
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; u.rate = 0.9; pickVoice(u);
        u.onend = function () { setTimeout(again, 350); };
        u.onerror = function () { if (loopKey === text) stopLoop(); };
        speechSynthesis.speak(u);
      } catch (e) { stopLoop(); }
    })();
  }
  function spkBtn(text) {
    return canSpeak ? '<button class="spk" data-act="say" data-t="' + esc(text) + '" aria-label="발음 듣기">🔊</button>' : '';
  }
  function exCtl(text) {
    if (!canSpeak) return '';
    return '<span class="pill"><button data-act="say" data-t="' + esc(text) + '" aria-label="듣기">🔊</button>' +
      '<button data-act="loop" data-t="' + esc(text) + '" aria-label="반복 재생">🔁</button></span>';
  }

  // =====================================================================
  // ===== Gemini 엔진 (원래 회사 단어장 v19를 그대로 옮김) =====
  // =====================================================================
  var GEM_BASE = 'https://generativelanguage.googleapis.com/v1beta';
  var LS_GEMKEY = 'be_gemkey', LS_GEMQ = 'be_gemquality', LS_GEMMODELS = 'be_gemmodels',
    LS_GEMLAST = 'be_gemlast', LS_GEMCOOL = 'be_gemcool', LS_GEMCOUNT = 'be_gemcount';
  // 모델 목록을 못 받아올 때 쓰는 예비 목록
  var GEM_FALLBACK = ['gemini-flash-lite-latest', 'gemini-2.5-flash-lite', 'gemma-3-27b-it', 'gemini-flash-latest', 'gemini-2.5-flash'];

  function today() { return dayStr(); }
  function isGemma(m) { return /^gemma-/.test(m); }
  function lsGet(k, d) { try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // 실패 이유를 쉬운 말로
  function gemReason(code) {
    return code === 'nokey' ? 'Gemini 키가 없어. 목록 탭 맨 아래 설정에서 넣어 줘.'
      : code === 'key' ? 'Gemini 키가 올바르지 않아.'
      : code === 'limit' ? 'Gemini 무료 사용 한도에 닿았어. 무료는 모델마다 하루 횟수가 정해져 있고 미국 서부 시간 자정(독일 오전 8~9시)에 초기화돼.'
      : code === 'blocked' ? 'Gemini 서버까지 요청이 닿지 못했어. 인터넷, 와이파이·VPN, 회사 네트워크 차단, 광고 차단 확장 프로그램을 확인해 봐.'
      : code === 'timeout' ? 'Gemini 응답이 너무 늦어(40초). 잠시 뒤 다시 해 봐.'
      : code === 'perm' ? 'Gemini 키 권한 문제야. 키의 사이트 제한이나 API 사용 설정을 확인해 줘.'
      : code === 'model' ? 'Gemini 모델을 쓸 수 없었어. 설정에서 "연결 확인"을 눌러 봐.'
      : code === 'parse' ? 'Gemini 답을 읽지 못했어. 한 번 더 해 봐.'

  // ----- 여러 개 한꺼번에 찾기 (5개씩 묶어서 한 번에 정리) -----
  async function bulkLookup() {
    var B = S.bulk;
    if (B.loading) return;
    var raw = S.bulkText.split(/[\n,;\t]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    var seen = {}, list = [], skipped = 0;
    raw.forEach(function (w) {
      var k = norm(w);
      if (!k || seen[k]) return;
      seen[k] = 1;
      if (findSame(w) || B.results.some(function (r) { return norm(r.word) === k; })) { skipped++; return; }
      list.push(w);
    });
    S.msg = '';
    if (!list.length) {
      S.msg = raw.length ? '새로 찾을 단어가 없어. 이미 저장했거나 같은 단어야.' : '단어를 한 줄에 하나씩, 또는 쉼표로 구분해서 넣어 줘.';
      S.msgType = 'err'; render(); return;
    }
    if (!S.gemKey) { S.msg = gemReason('nokey'); S.msgType = 'err'; render(); return; }
    var note = '';
    if (list.length > 20) { list = list.slice(0, 20); note = '사용 한도 때문에 한 번에 20개까지만 찾아.'; }
    B.loading = true; B.bad = []; B.skipped = skipped;
    var failMsg = '';
    for (var gi = 0; gi < list.length; gi += 5) {
      var chunk = list.slice(gi, gi + 5);
      B.prog = Math.min(gi + 5, list.length) + ' / ' + list.length;
      render();
      try {
        var arr = await gemEntriesBatch(chunk);
        chunk.forEach(function (cw, ci) {
          var d = arr.find(function (x) { return x && String(x.input || '').toLowerCase() === cw.toLowerCase(); }) || arr[ci];
          var ge = gemObjToEntry(d, cw, 3);
          if (!ge || findSame(ge.word) || B.results.some(function (r) { return norm(r.word) === norm(ge.word); })) B.bad.push(cw);
          else B.results.push(ge);
        });
      } catch (gerr) {
        failMsg = 'Gemini를 쓰지 못했어. ' + gemReason((gerr && gerr.gem) || 'other') + gemDetail() + ' 못 찾은 단어는 입력칸에 남겨둘게.';
        B.bad = B.bad.concat(list.slice(gi));
        break;
      }
      if (gi + 5 < list.length) await sleep(1500);
    }
    B.loading = false;
    if (failMsg) { S.msg = failMsg; S.msgType = 'err'; }
    else if (note) { S.msg = note; S.msgType = 'info'; }
    render();
  }

  async function photoToJpeg(file, maxDim) {
    var url = URL.createObjectURL(file);
    try {
      var img = await new Promise(function (res, rej) {
        var im = new Image();
        im.onload = function () { res(im); };
        im.onerror = function () { rej({ photo: 'format' }); };
        im.src = url;
      });
      var s = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * s));
      c.height = Math.max(1, Math.round(img.naturalHeight * s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var dataUrl = c.toDataURL('image/jpeg', 0.85);
      return { dataUrl: dataUrl, data: dataUrl.split(',')[1] };
    } finally { URL.revokeObjectURL(url); }
  }

  // GitHub에 요청 보내기
  async function gh(method, path, body, keepalive) {
    var headers = { 'Authorization': 'Bearer ' + SY.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    var opt = { method: method, headers: headers, cache: 'no-store' };
    if (body) {
      headers['Content-Type'] = 'application/json';
      opt.body = JSON.stringify(body);
      if (keepalive && opt.body.length < 60000) opt.keepalive = true; // 앱을 닫는 순간에도 끝까지 보내기
    }
    var r;
    try { r = await fetch(GH + path, opt); }
    catch (e) { throw { sync: 'net' }; }
    var data = null;
    try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw { sync: r.status === 401 ? 'token' : (r.status === 403 || r.status === 404) ? 'perm' : 'other', status: r.status };
    return data;
  }

  async function findOrCreateGist() {
    for (var page = 1; page <= 5; page++) {
      var list = await gh('GET', '/gists?per_page=100&page=' + page);
      if (!Array.isArray(list) || !list.length) break;
      var hit = list.find(function (g) { return g.files && g.files[GIST_FILE]; });
      if (hit) return hit.id;
      if (list.length < 100) break;
    }
    var files = {};
    files[GIST_FILE] = { content: remoteDoc(S.items, deleted) };
    var g = await gh('POST', '/gists', { description: '업무 영어 앱 데이터 (자동 동기화, 직접 고치지 마세요)', public: false, files: files });
    return g.id;
  }
  // Gist에서 데이터 읽기. Gist가 사라졌으면 null
  async function readRemote() {
    var g;

    catch (e) { if (e.status === 404) return null; throw e; }
    var f = g && g.files && g.files[GIST_FILE];
    if (!f) return { items: [], deleted: {} };
    var text = f.content;
    if (f.truncated && f.raw_url) { // 1MB가 넘으면 내용이 잘려서 원본 주소로 다시 받음
      try { text = await (await fetch(f.raw_url, { cache: 'no-store' })).text(); } catch (e) { throw { sync: 'net' }; }
    }
    var d;
    try { d = JSON.parse(text || '{}'); } catch (e) { throw { sync: 'parse' }; }
    return { items: Array.isArray(d.items) ? d.items : [], deleted: d.deleted && typeof d.deleted === 'object' ? d.deleted : {} };
  }

    var map = {};
    li.concat(ri).forEach(function (it) {

      var cur = map[it.id];

    });

      .filter(function (it) { return !(del[it.id] && del[it.id] >= (it.updatedAt || 0)); }); // 지운 뒤에 고친 게 아니면 지움
    // 같은 영어를 두 기기에서 따로 넣었으면 최근에 고친 하나만 남김
    var seen = {}, out = [];
    alive.sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); }).forEach(function (it) {
      var k = norm(it.en);
      if (seen[k]) { del[it.id] = Date.now(); return; }
      seen[k] = 1; out.push(it);
    });
    out.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    var cut = Date.now() - 90 * 864e5; // 90일 지난 삭제 기록은 정리
    Object.keys(del).forEach(function (id) { if (del[id] < cut) delete del[id]; });
    return { items: out, deleted: del };
  }
  // 바뀐 게 있는지 비교하기 위한 지문
  function sig(items, del) {
    var a = items.slice().sort(function (x, y) { return x.id < y.id ? -1 : x.id > y.id ? 1 : 0; });
    var dk = Object.keys(del || {}).sort().map(function (k) { return k + ':' + del[k]; });
    return JSON.stringify(a) + '|' + dk.join(',');
  }
  // 동기화 한 번: 받기 → 합치기 → (달라졌으면) 올리기
  async function syncNow(leaving) {
    if (!SY.token) return;
    if (SY.timer) { clearTimeout(SY.timer); SY.timer = null; }
    if (SY.busy) { SY.again = true; return; }
    SY.busy = true; setSync('busy');
    try {
      if (!SY.gistId) { SY.gistId = await findOrCreateGist(); try { localStorage.setItem(LS_GISTID, SY.gistId); } catch (e) {} }
      var remote = await readRemote();
      if (!remote) { // Gist를 누가 지웠으면 다시 찾거나 만듦
        SY.gistId = await findOrCreateGist(); try { localStorage.setItem(LS_GISTID, SY.gistId); } catch (e) {}
        remote = (await readRemote()) || { items: [], deleted: {} };
      }
      var m = mergeData(S.items, deleted, remote.items, remote.deleted);
      var mSig = sig(m.items, m.deleted);
      if (mSig !== sig(S.items, deleted)) { // 다른 기기에서 바뀐 게 들어옴
        S.items = m.items; deleted = m.deleted;
        store(LS_ITEMS, S.items); store(LS_DELETED, deleted);
        refreshAfterSync();
      }
      if (mSig !== sig(remote.items, remote.deleted)) { // 이 기기에서 바뀐 게 있으면 올림
        var files = {};
        files[GIST_FILE] = { content: remoteDoc(m.items, m.deleted) };
        await gh('PATCH', '/gists/' + SY.gistId, { files: files }, leaving);
      }
      SY.last = Date.now();
      try { localStorage.setItem(LS_SYNCLAST, String(SY.last)); } catch (e) {}
      setSync('ok');
    } catch (e) {
      setSync('err', syncReason(e && e.sync));
    } finally {
      SY.busy = false;
      if (SY.again) { SY.again = false; syncNow(); }
    }
  }
  // 저장할 때마다 바로 보내지 않고 2.5초 모았다가 한 번에
  function scheduleSync() {
    if (!SY.token) return;
    if (SY.timer) clearTimeout(SY.timer);
    SY.timer = setTimeout(function () { SY.timer = null; syncNow(); }, 2500);
    if (!SY.busy) setSync('pending');
  }
  // 다른 기기 데이터가 들어오면 지금 화면을 새로 그림 (입력 중이거나 수정 중이면 건드리지 않음)
  function refreshAfterSync() {
    if (S.tab === 'list' && !S.edit && !S.editId) renderListBody();
    else if (S.tab === 'review' && !S.run) render();
  }
  // 앱을 닫거나 다른 앱으로 갈 때 남은 걸 올리고, 돌아오면 새로 받음
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('visibilitychange', function () {
      if (!SY.token) return;
      if (document.visibilityState === 'hidden') { if (SY.timer) syncNow(true); }
      else if (Date.now() - SY.last > 30000) syncNow();
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('online', function () { if (SY.token) syncNow(); });
  }

  // ----- 단어 수정 (원래 단어장의 뜻별 수정 화면) -----
  function fld(label, id, val, ph) {
    return field(label, '<input type="text" id="' + id + '" value="' + esc(val) + '" placeholder="' + esc(ph || '') + '" autocomplete="off" autocapitalize="none" spellcheck="false">');
  }
  function wordEditHTML() {
    var d = S.edit.draft;
    var h = fld('단어·숙어', 'ed-word', d.word) +
      fld('퀴즈에 나오는 한글 뜻', 'ed-ko', d.ko, '예: (명사) 송장 / (동사) 청구하다') +
      fld('쓰임 팁', 'ed-tip', d.tip, '뉘앙스나 자주 쓰는 표현') +
      fld('메모', 'ed-memo', d.memo);
    d.senses.forEach(function (s, i) {
      h += '<div class="sense"><div class="top" style="display:flex;justify-content:space-between;align-items:center"><b class="hint" style="font-weight:700">뜻 ' + (i + 1) + '</b>' +
        '<button class="small" data-act="edsdrop" data-i="' + i + '">이 뜻 빼기</button></div>' +
        fld('품사 (명, 동, 형…)', 'ed-pos-' + i, s.pos) + fld('한글 풀이', 'ed-kd-' + i, s.koDef) +
        fld('영어 뜻', 'ed-en-' + i, s.en) + fld('예문', 'ed-ex-' + i, s.ex) + fld('예문 한글 번역', 'ed-exko-' + i, s.exKo) + '</div>';
    });
    return h + '<div style="margin-top:12px"><button class="small" data-act="edsadd">+ 뜻 추가</button></div>' +
      '<div class="actions"><button data-act="edcancel">취소</button>' +
      '<button class="okbtn" data-act="edsave">수정 저장</button></div>';
  }
  function startEdit(id) {
    var it = getItem(id);
    if (!it) return;
    S.delArm = null;
    if (it.type === 'word') {
      S.editId = null;
      S.edit = { id: id, draft: { word: it.en, ko: it.ko || '', tip: it.tip || '', memo: it.memo || '', senses: JSON.parse(JSON.stringify(it.senses || [])) } };
    } else {
      S.edit = null; S.editId = id;
    }
    renderListBody();
  }
  // 화면에 적힌 값을 임시 저장소로 모음 (뜻 추가·빼기 전에도 씀)
  function collectEdit() {
    var E = S.edit;
    if (!E) return;
    function v(id) { var el = document.getElementById(id); return el ? el.value : null; }
    var map0 = { word: 'ed-word', ko: 'ed-ko', tip: 'ed-tip', memo: 'ed-memo' };
    Object.keys(map0).forEach(function (k) { var x = v(map0[k]); if (x !== null) E.draft[k] = x; });
    var map = { pos: 'ed-pos-', koDef: 'ed-kd-', en: 'ed-en-', ex: 'ed-ex-', exKo: 'ed-exko-' };
    E.draft.senses.forEach(function (s, i) {
      Object.keys(map).forEach(function (k) { var x = v(map[k] + i); if (x !== null) s[k] = x; });
    });
  }
  function saveWordEdit() {
    collectEdit();
    var E = S.edit, it = E && getItem(E.id);
    if (!it) { S.edit = null; renderListBody(); return; }
    var word = str(E.draft.word);
    if (!word) { alert('단어는 비워둘 수 없어.'); return; }
    if (findSame(word, it.id)) { alert('같은 표현이 이미 목록에 있어.'); return; }
    var senses = E.draft.senses.map(function (s) {
      return { pos: str(s.pos), koDef: str(s.koDef), en: str(s.en), ex: str(s.ex), exKo: str(s.exKo) };
    }).filter(function (s) { return s.en || s.koDef; });
    var ko = str(E.draft.ko);
    if (!ko && !senses.length) { alert('한글 뜻이나 뜻 하나는 있어야 해.'); return; }
    if (norm(word) !== norm(it.en)) it.ipa = ''; // 철자가 바뀌면 발음기호는 맞지 않으니 지움
    it.en = word; it.ko = ko; it.tip = str(E.draft.tip); it.memo = str(E.draft.memo); it.senses = senses;
    touch(it);
    persist();
    S.edit = null;
    renderListBody();
  }

  // ----- 문장 수정 -----
  function sentenceEditHTML(it) {
    return '<article class="item" data-id="' + it.id + '">' +
      field('영어 문장', '<textarea data-e="en" rows="2">' + esc(it.en) + '</textarea>') +
      field('한글 뜻', '<textarea data-e="ko" rows="2">' + esc(it.ko) + '</textarea>') +
      field('핵심 표현', '<input data-e="key" value="' + esc(it.key) + '">') +
      field('팁', '<textarea data-e="tip" rows="2">' + esc(it.tip) + '</textarea>') +
      field('메모', '<input data-e="memo" value="' + esc(it.memo) + '">') +
      '<div class="actions"><button data-act="cancelEdit">취소</button>' +
      '<button class="okbtn" data-act="saveSentEdit" data-id="' + it.id + '">수정 저장</button></div>' +
      '</article>';
  }
  function saveSentEdit(id) {
    var it = getItem(id);
    var box = document.querySelector('.item[data-id="' + id + '"]');
    if (!it || !box) return;
    function g(name) { return box.querySelector('[data-e="' + name + '"]').value.trim(); }
    var en = g('en'), ko = g('ko'), key = g('key');
    var err = validateSentence(en, ko, key, id);
    if (err) { alert(err); return; }
    it.en = en; it.ko = ko; it.key = key; it.tip = g('tip'); it.memo = g('memo');
    touch(it);
    persist();
    S.editId = null;
    renderListBody();
  }

  // ----- 복습 첫 화면 -----
  function viewReviewHome() {
    resetDaily();
    var st = S.settings, done = st.doneCount;
    var left = Math.max(0, st.daily - done);
    var due = dueItems().length;
    var pct = Math.min(100, Math.round(done / st.daily * 100));
    var startText = !S.items.length ? '먼저 추가 탭에서 넣어 줘'
      : left === 0 ? '오늘 목표 달성! 🎉'
      : due === 0 ? '오늘 복습할 차례인 게 없어'
      : '복습 시작 (' + Math.min(left, due) + '개)';
    return '<section class="card">' +
      '<h2>오늘의 복습</h2>' +
      '<div class="big">' + done + ' / ' + st.daily + '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<p class="hint">복습 차례가 된 항목 ' + due + '개 · 전체 ' + S.items.length + '개</p>' +
      '<button class="primary" data-act="start"' + (left && due ? '' : ' disabled') + '>' + startText + '</button>' +
      '</section>' +
      '<section class="card"><h3>설정</h3>' +
      field('하루 복습 개수', '<input type="number" inputmode="numeric" min="1" max="200" data-set="daily" value="' + st.daily + '">') +
      '<label class="f"><span>퀴즈 방식</span><div class="seg">' +
      segBtn('mode', 'mix', st.mode, '섞어서') + segBtn('mode', 'blank', st.mode, '빈칸 채우기') + segBtn('mode', 'trans', st.mode, '해석하기') +
      '</div></label>' +
      '</section>' +
      '<section class="card"><h3>자유 연습</h3>' +
      '<p class="hint" style="margin-top:0">전체에서 10개를 무작위로 풀어. 복습 일정에는 영향이 없어.</p>' +
      '<button data-act="free"' + (S.items.length ? '' : ' disabled') + ' style="width:100%">자유 연습 시작</button>' +
      '</section>';
  }

  function pickKind() {
    var m = S.settings.mode;
    if (m === 'blank' || m === 'trans') return m;
    return Math.random() < 0.5 ? 'blank' : 'trans';
  }

  function startRun(scheduled) {
    var pick;
    if (scheduled) {
      resetDaily();
      var left = Math.max(0, S.settings.daily - S.settings.doneCount);
      pick = shuffle(dueItems().slice(0, left));
    } else {
      pick = shuffle(S.items.slice()).slice(0, 10);
    }
    if (!pick.length) return;
    S.run = {
      scheduled: scheduled,
      queue: pick.map(function (it) { return { id: it.id, kind: pickKind(), retry: false }; }),
      first: pick.length, idx: 0, state: 'ask', input: '', ok: null, right: 0, wrong: 0
    };
    render();
  }

  // ----- 복습 진행 화면 -----
  function viewRun() {
    var r = S.run;
    // 복습 중에 지워진 항목은 건너뜀
    while (r.idx < r.queue.length && !getItem(r.queue[r.idx].id)) r.idx++;
    if (r.idx >= r.queue.length) return viewResult();
    var cur = r.queue[r.idx], it = getItem(cur.id);
    var head = '<div class="runhead"><span>' + (r.idx + 1) + ' / ' + r.queue.length +
      (cur.retry ? ' · 다시 풀기' : '') + '</span><button class="link" data-act="stop">그만하기</button></div>';
    return head + '<section class="card">' + (cur.kind === 'blank' ? viewBlank(it, r) : viewTrans(it, r)) + '</section>';
  }

  // 빈칸 채우기: 문장은 핵심 표현을, 단어는 한글 뜻을 보고 영어를 씀
  function viewBlank(it, r) {
    var isWord = it.type === 'word';
    var b = isWord ? { answer: it.en } : blankInfo(it);
    if (r.state === 'ask') {
      var q = isWord
        ? '<p class="qlabel">이 뜻의 영어는?</p><p class="qtext">' + esc(meaning(it)) + '</p><p class="qhint">힌트: ' + esc(letterHint(it.en)) + '</p>'
        : '<p class="qlabel">빈칸에 들어갈 표현은?</p><p class="qtext">' + esc(b.before) +
          '<span class="blank" style="min-width:' + Math.max(3, b.answer.length) + 'ch">.</span>' + esc(b.after) +
          '</p><p class="qhint">' + esc(it.ko) + '</p>';
      return q +
        '<input data-run="input" data-autofocus autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어로 입력" style="margin-top:14px" value="' + esc(r.input) + '">' +
        '<div class="row"><button data-act="giveup">모르겠어</button><button class="primary" style="margin:0" data-act="check">확인</button></div>';
    }
    return resultBlock(it, r.ok,
      '<div class="answer"><b>정답</b>' + esc(b.answer) + '</div>' +
      (!r.ok && r.input.trim() ? '<div class="answer"><b>내 답</b>' + esc(r.input) + '</div>' : ''));
  }

  // 영문 보고 해석: 떠올린 뒤 정답을 보고 스스로 채점
  function viewTrans(it, r) {
    var isWord = it.type === 'word';
    var top = '<p class="qlabel">무슨 뜻일까? 머릿속으로 해석한 뒤 정답을 봐.</p>' +
      '<p class="qtext">' + esc(it.en) + (isWord && it.ipa ? ' <span class="ipa">' + esc(it.ipa) + '</span>' : '') + ' ' + spkBtn(it.en) + '</p>';
    if (r.state === 'ask') {
      return top + '<button class="primary" data-act="reveal">정답 보기</button>';
    }
    return top + '<div class="answer"><b>한글 뜻</b>' + esc(meaning(it)) + '</div>' + detailBlock(it) +
      (it.memo ? '<p class="memo">' + esc(it.memo) + '</p>' : '') +
      '<div class="row"><button class="nobtn" data-act="self" data-v="0">틀렸어</button>' +
      '<button class="okbtn" data-act="self" data-v="1">맞았어</button></div>';
  }

  // 정답 화면 아래 자세한 내용: 단어는 사전 모양, 문장은 팁
  function detailBlock(it) {
    if (it.type === 'word') return (it.senses && it.senses.length) || it.tip ? entryHTML(itemEntry(it)) : '';
    return it.tip ? '<p class="tip">💡 ' + esc(it.tip) + '</p>' : '';
  }

  function resultBlock(it, ok, extra) {
    var isWord = it.type === 'word';
    return '<div class="banner ' + (ok ? 'ok' : 'no') + '">' + (ok ? '정답!' : '아쉬워, 끝에 한 번 더 나와') + '</div>' +
      extra +
      (isWord ? '' : '<div class="answer"><b>전체</b>' + highlight(it.en, blankInfo(it).answer) + ' ' + spkBtn(it.en) + '</div>') +
      '<div class="answer"><b>뜻</b>' + esc(meaning(it)) + '</div>' + detailBlock(it) +
      '<button class="primary" data-act="next" data-autofocus>다음</button>';
  }

  function viewResult() {
    var r = S.run;
    var pct = r.first ? Math.round(r.right / r.first * 100) : 0;
    return '<section class="card" style="margin-top:12px">' +
      '<h2>' + (r.scheduled ? '오늘 복습 끝!' : '자유 연습 끝!') + '</h2>' +
      '<div class="big">' + pct + '%</div>' +
      '<p class="hint">처음 풀 때 맞힘 ' + r.right + ' · 틀림 ' + r.wrong + '</p>' +
      (r.scheduled ? '<p class="hint">틀린 건 내일 다시 나오고, 맞힌 건 며칠 뒤에 다시 나와.</p>' : '') +
      '<button class="primary" data-act="stop">처음으로</button></section>';
  }

  // 채점 결과 기록 + 다음 복습 날짜 정하기
  function grade(ok) {
    var r = S.run, cur = r.queue[r.idx], it = getItem(cur.id);
    r.ok = ok; r.state = 'done';
    if (!it || cur.retry) return; // 다시 풀기는 기록하지 않음
    if (ok) { r.right++; it.right++; } else { r.wrong++; it.wrong++; }
    if (r.scheduled) {
      if (ok) {
        it.due = dayStr(INTERVALS[Math.min(it.level, INTERVALS.length - 1)]);
        it.level++;
      } else {
        it.level = 0;
        it.due = dayStr(1);
      }
      resetDaily();
      S.settings.doneCount++;
      saveSettings();
    }
    if (!ok) r.queue.push({ id: it.id, kind: cur.kind, retry: true });
    touch(it);
    persist();
  }

  function checkBlank(giveUp) {
    var r = S.run;
    if (!r || r.state !== 'ask') return;
    var it = getItem(r.queue[r.idx].id);
    if (!giveUp && !r.input.trim()) return;
    var answer = it.type === 'word' ? it.en : blankInfo(it).answer;
    grade(!giveUp && norm(r.input) === norm(answer));
    render();
  }

  function nextQ() {
    var r = S.run;
    stopLoop();
    r.idx++; r.state = 'ask'; r.input = ''; r.ok = null;
    render();
    window.scrollTo(0, 0);
  }

  // ===== 백업 =====
  function exportData() {
    var data = { app: 'biz-english', version: 3, exportedAt: new Date().toISOString(), items: S.items };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'biz-english-backup-' + dayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  // 가져오기: 이 앱 백업, 그리고 원래 회사 단어장 백업(word, senses 모양)도 읽음
  function importFile(file) {
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result);
        var arr = Array.isArray(d) ? d : d.items;
        if (!Array.isArray(arr)) throw new Error('형식');
        var added = 0, skipped = 0;
        arr.forEach(function (x) {
          if (!x) return;
          var fromOld = !x.en && x.word; // 원래 회사 단어장 백업
          if (fromOld && x.lang === 'ko') { skipped++; return; } // 국어 단어는 이 앱에서 안 씀
          var en = str(x.en || x.word);
          var senses = Array.isArray(x.senses) ? x.senses.map(function (s) {
            return { pos: str(s.pos), koDef: str(s.koDef), en: str(s.en), ex: str(s.ex), exKo: str(s.exKo) };
          }) : [];
          var ko = str(x.ko) || senses.map(function (s) { return s.koDef; }).filter(Boolean).slice(0, 3).join(', ');
          if (!en || !ko || findSame(en)) { skipped++; return; }
          var type = x.type === 'sentence' ? 'sentence' : 'word';
          S.items.push(newItem(type, {
            id: x.id && !fromOld ? x.id : uid(), en: en, ko: ko, key: type === 'sentence' ? str(x.key) : '',
            tip: str(x.tip), memo: str(x.memo), ipa: str(x.ipa), senses: type === 'word' ? senses : [],
            createdAt: x.createdAt || Date.now(), level: fromOld ? 0 : (x.level | 0), due: fromOld ? dayStr() : (x.due || dayStr()),
            right: x.right | 0, wrong: fromOld ? (x.miss | 0) : (x.wrong | 0)
          }));
          added++;
        });
        persist();
        alert(added + '개를 가져왔어.' + (skipped ? ' 이미 있거나 쓸 수 없는 ' + skipped + '개는 건너뛰었어.' : ''));
        render();
      } catch (e) {
        alert('백업 파일을 읽지 못했어. 내보내기로 만든 파일인지 확인해 줘.');
      }
    };
    rd.readAsText(file);
  }

  // ===== 버튼 누름, 글자 입력 처리 =====
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-tab]');
    if (!t || t.disabled) return;
    if (t.dataset.tab) {
      stopLoop();
      S.tab = t.dataset.tab; S.msg = ''; S.editId = null; S.edit = null; S.delArm = null;
      render(); window.scrollTo(0, 0);
      return;
    }
    var id = t.dataset.id, v = t.dataset.v;
    switch (t.dataset.act) {
      // 추가 화면
      case 'atype': S.addType = v; S.msg = ''; render(); break;
      case 'wmode': S.wordMode = v; S.msg = ''; render(); break;
      case 'lookup': lookup(); break;
      case 'savefound': saveFound(false); break;
      case 'overwrite': saveFound(true); break;
      case 'discard': S.found = null; S.msg = ''; render(); break;
      case 'sdrop': if (S.found) { S.found.senses.splice(Number(t.dataset.i), 1); render(); } break;
      case 'bulkgo': bulkLookup(); break;
      case 'bdrop': S.bulk.results.splice(Number(t.dataset.i), 1); render(); break;
      case 'bulksave': bulkSaveAll(); break;
      case 'photoclear': S.photoUrl = ''; render(); break;
      case 'auto': autoFill(); break;
      case 'savesentence': saveSentence(); break;
      // 발음
      case 'say': speak(t.dataset.t); break;
      case 'loop': toggleLoop(t.dataset.t, t); break;
      // 목록 화면
      case 'filter': S.filter = v; render(); break;
      case 'toggle': S.open[id] = !S.open[id]; renderListBody(); break;
      case 'edit': startEdit(id); break;
      case 'edsadd': collectEdit(); S.edit.draft.senses.push({ pos: '', koDef: '', en: '', ex: '', exKo: '' }); renderListBody(); break;
      case 'edsdrop': collectEdit(); S.edit.draft.senses.splice(Number(t.dataset.i), 1); renderListBody(); break;
      case 'edsave': saveWordEdit(); break;
      case 'edcancel': S.edit = null; renderListBody(); break;
      case 'cancelEdit': S.editId = null; renderListBody(); break;
      case 'saveSentEdit': saveSentEdit(id); break;
      case 'del':
        if (S.delArm === id) {
          S.items = S.items.filter(function (x) { return x.id !== id; });
          markDeleted(id); // 다른 기기에서도 지워지게 기록
          S.delArm = null; persist();
        } else {
          S.delArm = id;
          setTimeout(function () { if (S.delArm === id) { S.delArm = null; renderListBody(); } }, 3000);
        }
        renderListBody();
        break;
      case 'export': exportData(); break;
      case 'gemsave':
        var inp = document.getElementById('gemKeyInput');
        S.gemKey = inp ? inp.value.trim() : '';
        try {
          if (S.gemKey) localStorage.setItem(LS_GEMKEY, S.gemKey); else localStorage.removeItem(LS_GEMKEY);
          localStorage.removeItem(LS_GEMMODELS); // 키가 바뀌면 모델 목록도 새로
        } catch (err) {}
        S.gemDiag = '';
        if (S.gemKey) gemTest(); else { S.gemResult = '키를 지웠어.'; S.gemOK = true; render(); }
        break;
      case 'ghsave':
        var ti = document.getElementById('ghTokenInput');
        SY.token = ti ? ti.value.trim() : '';
        SY.gistId = ''; // 새 토큰이면 Gist를 다시 찾음
        try {
          localStorage.removeItem(LS_GISTID);
          if (SY.token) localStorage.setItem(LS_GHTOKEN, SY.token); else localStorage.removeItem(LS_GHTOKEN);
        } catch (err) {}
        render();
        if (SY.token) syncNow(); else setSync('off');
        break;
      case 'ghsync': syncNow(); break;
      case 'ghoff':
        SY.token = ''; SY.gistId = '';
        try { localStorage.removeItem(LS_GHTOKEN); localStorage.removeItem(LS_GISTID); } catch (err) {}
        setSync('off'); render();
        break;
      case 'gemtest': gemTest(); break;
      case 'gemq':
        S.gemQuality = v === '1';
        try { localStorage.setItem(LS_GEMQ, S.gemQuality ? '1' : '0'); } catch (err) {}
        S.gemResult = ''; render();
        break;
      // 복습
      case 'mode': S.settings.mode = v; saveSettings(); render(); break;
      case 'start': startRun(true); break;
      case 'free': startRun(false); break;
      case 'check': checkBlank(false); break;
      case 'giveup': checkBlank(true); break;
      case 'reveal': S.run.state = 'reveal'; render(); break;
      case 'self': grade(v === '1'); nextQ(); break;
      case 'next': nextQ(); break;
      case 'stop': stopLoop(); S.run = null; render(); break;
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target, id = t.id;
    if (id === 'q') S.q = t.value;
    else if (id === 'bulk') S.bulkText = t.value;
    else if (id === 'foundKo') S.foundKo = t.value;
    else if (id === 'foundMemo') S.foundMemo = t.value;
    else if (t.dataset && t.dataset.f) S.form[t.dataset.f] = t.value;
    else if (t.dataset && t.dataset.list === 'q') { S.search = t.value; renderListBody(); }
    else if (t.dataset && t.dataset.run === 'input' && S.run) S.run.input = t.value;
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.set === 'daily') {
      var n = parseInt(t.value, 10);
      if (!(n >= 1)) n = 10;
      if (n > 200) n = 200;
      S.settings.daily = n; saveSettings(); render();
    }
    if (t.dataset && t.dataset.file === 'import' && t.files && t.files[0]) { importFile(t.files[0]); t.value = ''; }
    if ((t.id === 'photo-cam' || t.id === 'photo-pick') && t.files && t.files[0]) {
      handlePhoto(t.files[0]);
      try { t.value = ''; } catch (err) {}
    }
    if (t.id === 'photo-mode') S.photoMode = t.value;
  });

  // 엔터: 단어 찾기 / 빈칸 확인
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.isComposing) return;
    var t = e.target;
    if (t && t.id === 'q') { e.preventDefault(); S.q = t.value; lookup(); }
    else if (t && t.dataset && t.dataset.run === 'input') { e.preventDefault(); checkBlank(false); }
  });

  render();
  setSync(SY.token ? 'ok' : 'off');
  if (SY.token) syncNow(); // 앱을 열면 다른 기기 데이터를 먼저 받아옴
})();
</script>
</body>
</html>
