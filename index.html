<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a5f8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="업무 영어">
<title>업무 영어</title>
<style>
/* ===== 색상 (크림색 바탕, 남색 테두리, 하늘색 입체 버튼, 빨간 선택) ===== */
:root{
  --bg:#fdf6ec; --card:#ffffff; --text:#2b2b2b; --sub:#6b7280; --line:#e6ebf0;
  --navy:#2a5f8f; --sky:#bfe4f8; --sky-d:#a5d6f2; --red:#e8434f; --red-d:#a8212c; --title:#b01f2e; --word:#a3192b;
  --dash:#7cc8ec; --cream:#fff8e7; --live:#f8fbff;
  --ok:#16a34a; --ok-soft:#e7f6ec; --no:#dc2626; --no-soft:#fdecec; --mark:#fff1a8;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
header{max-width:680px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:baseline;gap:8px}
h1{font-size:15px;margin:0;color:var(--navy)}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px;color:var(--navy)}
.ver{color:var(--sub);font-size:12px}
main{max-width:680px;margin:0 auto;padding:0 12px}

/* 카드: 남색 두꺼운 테두리 */
.card{background:var(--card);border:3px solid var(--navy);border-radius:16px;padding:16px;margin:12px 0}
/* 빨간 제목 + 하늘색 두 줄 밑줄 */
.ttl{color:var(--title);font-weight:800;font-size:18px;margin:0 0 14px;padding-bottom:8px;border-bottom:4px double var(--dash)}
.ttlrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:8px;border-bottom:4px double var(--dash)}
.ttlrow .ttl{flex:1 1 auto;margin:0;padding:0;border:0}

label.f{display:block;margin:14px 0 0}
label.f>span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.fhint{font-size:12px;color:var(--sub);margin-top:4px}
input,textarea,select{width:100%;font:inherit;color:inherit;background:#fff;border:2px solid var(--navy);border-radius:10px;padding:10px 12px}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{outline:3px solid var(--sky);outline-offset:0}
input:disabled{background:#f3f4f6;color:var(--sub)}

/* 하늘색 입체 버튼 */
button,.btn{font:inherit;font-weight:600;color:#173a5a;background:var(--sky);border:2px solid var(--navy);border-radius:10px;
  padding:9px 14px;cursor:pointer;display:inline-block;box-shadow:0 3px 0 var(--navy);transition:transform .05s}
button:active:not(:disabled),.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--navy)}
button:hover:not(:disabled){background:var(--sky-d)}
button:disabled{background:#e5e7eb;color:#9ca3af;border-color:#c5cbd3;box-shadow:0 3px 0 #c5cbd3;cursor:default}
button.on,.primary{background:var(--red);color:#fff;border-color:var(--red-d);box-shadow:0 3px 0 var(--red-d)}
button.on:hover:not(:disabled),.primary:hover:not(:disabled){background:#d93a46}
.primary{width:100%;padding:12px;margin-top:16px}
.row{display:flex;gap:10px;margin-top:12px}
.row>*{flex:1;text-align:center}
.danger{color:var(--no)}
button.armed{background:var(--no);color:#fff;border-color:#991b1b;box-shadow:0 3px 0 #991b1b}
.link{border:0;background:none;box-shadow:none;color:var(--sub);padding:2px 0;text-decoration:underline;font-weight:500}
.link:hover:not(:disabled){background:none}
.small{padding:5px 10px;font-size:13px}

/* 고르는 버튼 묶음: 동그란 알약 모양 */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 0;border-radius:999px;padding:7px 12px;font-size:14px}
.seg.sub{margin-top:12px}
.seg.pill3{flex:0 0 auto}
.seg.pill3 button{flex:0 0 auto;padding:6px 16px}
.seg.mini button{flex:0 0 auto;padding:4px 10px;font-size:12px;box-shadow:0 2px 0 var(--navy)}
.lvrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}

/* 아래쪽 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;background:var(--bg);border-top:3px solid var(--navy);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:10}
.tabs button{flex:1;max-width:150px;padding:10px 0}
.tabs button.on{background:var(--red);color:#fff;border-color:var(--red-d);box-shadow:0 3px 0 var(--red-d)}

.msg{margin:12px 0 0;padding:10px 12px;border-radius:10px;font-size:14px}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.err{background:var(--no-soft);color:var(--no)}
.msg.info{background:#e6f4fc;color:var(--navy)}
.hint{font-size:13px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.searchrow{display:flex;gap:8px;margin-top:14px}
.searchrow input{flex:1}
.searchrow button{flex:none}

/* 단어장 목록 */
.searchbox{display:flex;align-items:center;gap:6px;border:2px solid var(--navy);border-radius:12px;padding:0 10px;background:#fff}
.searchbox input{border:0;padding:10px 4px;outline:none}
.searchbox:focus-within{outline:3px solid var(--sky)}
.vlist{list-style:none;margin:8px 0 0;padding:0}
.vrow{border-bottom:1px solid var(--line)}
.vline{display:flex;align-items:center;gap:10px;padding:10px 4px}
.vtext{flex:1;min-width:0;word-break:break-word;font-size:15px}
.vw{color:var(--word);font-weight:800}
.vbtns{display:flex;gap:8px;flex:none}
.ibtn{width:44px;height:36px;padding:0;font-size:16px;line-height:1}
.vdetail{padding:4px 6px 14px}
.pager{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:16px}
.pager span{color:var(--sub);font-size:14px}
.pbtn{width:44px;height:38px;padding:0}
.count{font-size:12px;color:var(--sub);text-align:center;margin:8px 0 0}

/* 단어 사전 모양 */
.entry{margin-top:6px}
.hw{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hw .word{font-size:21px;font-weight:800;color:var(--word);word-break:break-word}
.ipa{color:var(--sub);font-size:14px}
.posh{margin:14px 0 4px;font-size:12px;font-weight:700;color:var(--navy)}
.sn{display:flex;gap:8px;margin:6px 0}
.sn .no{color:var(--sub);min-width:18px}
.sb{flex:1;min-width:0}
.smain{font-weight:600}
.sdef{font-size:13px;color:var(--sub)}
.ex2{margin-top:4px;padding:6px 10px;background:var(--cream);border-radius:8px;font-size:14px}
.predit{margin-top:8px;padding:10px;border:2px solid var(--navy);border-radius:10px;background:#fff}
.predit label{display:block;font-size:13px;margin-bottom:6px}
.predit input{width:100%;margin-top:2px}
.btnrow button kbd{margin-left:4px;font-size:11px;opacity:.7}
.exadd{font-size:12px;padding:2px 8px;margin-left:2px}
.exsaved{font-size:12px;color:var(--sub);white-space:nowrap}
.ex2 .k{color:var(--sub);font-size:13px;margin-top:2px}
.spk,.pill button{border:0;background:none;box-shadow:none;padding:2px 6px;font-size:16px;border-radius:6px}
.spk:hover:not(:disabled),.pill button:hover:not(:disabled){background:var(--sky)}
.pill{display:inline-flex;gap:2px;vertical-align:middle}
.pill button.on{background:var(--sky);color:inherit}
.src{font-size:12px;color:var(--sub);margin-top:10px}
.thumb{display:block;max-width:100%;max-height:220px;border-radius:10px;margin-top:10px}
.brow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.brow .bi{flex:1;min-width:0}
.brow .bw{font-weight:800;color:var(--word)}
.sense{border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:#e6f4fc;color:var(--navy)}
.tag.word{background:var(--ok-soft);color:var(--ok)}
.en{font-size:17px;font-weight:700;margin:8px 0 2px;word-break:break-word}
.ko{margin:0;color:var(--text)}
.memo{margin:6px 0 0;font-size:13px;color:var(--sub)}
.meta{margin:8px 0 0;font-size:12px;color:var(--sub)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.actions button{padding:6px 14px;font-size:14px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.tip{margin:8px 0 0;font-size:13px;color:#5b4a1f;background:var(--cream);border-radius:8px;padding:6px 10px}
.editbox{margin-top:4px}

/* 연습 */
.goal{font-size:14px;font-weight:700;color:var(--navy);background:#e6f4fc;border-radius:999px;padding:4px 12px;white-space:nowrap}
.goal.done{background:var(--ok-soft);color:var(--ok)}
.bar{height:8px;background:#eef2f6;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}
.tylabel{margin:14px 0 6px;font-size:14px;color:var(--sub)}
.duetag{margin-left:8px;font-size:11px;font-weight:700;color:#fff;background:var(--navy);border-radius:999px;padding:1px 8px;vertical-align:1px}
.prq{font-size:20px;font-weight:500;padding:16px;border:2px dashed var(--dash);border-radius:12px;background:var(--cream);word-break:break-word}
.tyguide{margin:6px 0 0;font-size:12px;color:var(--sub)}
.prshow{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--mark);word-break:break-word}
.prlive{min-height:64px;margin-top:12px;padding:12px 14px;border:2px solid var(--navy);border-radius:12px;background:var(--live);font-size:18px;word-break:break-word}
.prsk{font-family:ui-monospace,Menlo,Consolas,monospace;color:#9aa3af;font-size:15px;margin-top:2px}
.tyline{height:2px;width:70%;margin:18px 4px;background:#cfd8e3;border-radius:2px}
#prIn{margin-top:12px;font-size:17px;padding:12px 14px}
.w.ok{color:var(--ok)}
.w.bad{color:var(--no);text-decoration:underline wavy}
.w.miss{color:var(--no);font-weight:700}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btnrow button{flex:0 1 auto;padding:9px 14px;font-size:14px}
.tyfoot{margin:16px 0 0;font-size:14px;color:var(--sub)}
.tyfoot b{color:var(--text)}
.banner{padding:10px 12px;border-radius:10px;font-weight:700;margin-bottom:12px}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.no{background:var(--no-soft);color:var(--no)}
.big{font-size:24px;font-weight:800;margin:2px 0;color:var(--navy)}
.answer{margin:8px 0}
.answer b{color:var(--sub);font-weight:500;font-size:13px;display:block}
.autobtn{width:100%;margin-top:10px}
.moretgl{margin-top:12px;font-size:14px;color:var(--navy);text-decoration:none;font-weight:700}
.morefill{color:var(--sub);font-weight:500;font-size:13px}
.addc label.f{margin-top:10px}
.addc label.f>span{margin-bottom:2px}
.addc input,.addc textarea{padding:8px 12px}
.addc .autobtn{margin-top:8px;padding:7px 14px}
.addc .primary{margin-top:12px;padding:10px}
.addc .moretgl{margin-top:8px}
.tblrow{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:6px;align-items:center;margin-top:6px}
.tblrow input{padding:6px 8px;font-size:14px;border-width:1.5px}
.tblhead{font-size:12px;color:var(--sub);font-weight:700;margin-top:4px}
.tblrow.dup input{opacity:.5}
.duptag{grid-column:1/-1;font-size:12px;color:var(--sub);margin-top:-2px}
.maskask{border:2px dashed var(--red);background:#fff5f5;border-radius:12px;padding:10px 12px;margin-top:12px}
.maskrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.maskrow code{font-weight:700;color:var(--word);min-width:80px}
.masklist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.maskchip{background:#e6f4fc;border-radius:999px;padding:3px 10px;font-size:13px}
.maskchip .link{padding:0 2px;font-size:15px}
.w.ph{color:#9aa3af}
.formrow{margin:6px 0 8px;padding-left:4px}
.formrow .fw{color:var(--word);font-weight:800}
.fpos{font-size:12px;color:var(--navy);background:#e6f4fc;border-radius:999px;padding:1px 8px}
.gradebox{margin-top:12px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fbfdff}
.graderow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.graderow button{padding:8px 4px;line-height:1.2}
.graderow small{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:2px}
.graderow button.g1.on{background:var(--red);border-color:var(--red-d);box-shadow:0 3px 0 var(--red-d);color:#fff}
.graderow button.g2.on{background:#f59e0b;border-color:#b45309;box-shadow:0 3px 0 #b45309;color:#fff}
.graderow button.g3.on{background:#16a34a;border-color:#166534;box-shadow:0 3px 0 #166534;color:#fff}
.graderow button.g4.on{background:#2563eb;border-color:#1e3a8a;box-shadow:0 3px 0 #1e3a8a;color:#fff}
.duetag.new{background:#16a34a}
.duetag.again{background:var(--red)}
.duetag.extra{background:#9aa3af}
.duetag.weak{background:#f59e0b}
.prq-en{font-weight:700;color:var(--word);font-size:22px}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px}
label.chk input{width:auto}
.streak{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:10px}
.flame{font-weight:800;color:#9aa3af;background:#f3f4f6;border-radius:999px;padding:3px 12px}
.flame.on{color:#c2410c;background:#ffedd5}
.weekdots{display:flex;gap:4px;margin-left:auto}
.wd{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--sub);width:26px}
.wd i{display:block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:#eef2f6;font-style:normal;font-size:12px;margin-bottom:1px}
.wd.done i{background:#ffedd5}
.wd.frz i{background:#e0f2fe}
.wd.today i{outline:2px dashed var(--red)}
.wd.future i{background:#f8fafc}
.mghead{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.mghead b{font-size:20px;color:var(--navy)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.mcard{height:100%;min-height:70px;padding:8px;font-size:15px;line-height:1.3;word-break:break-word}
.mcard.en{color:var(--word)}
.mcard.ko{color:#173a5a;font-weight:500}
.mcard.sel{background:#fde68a;border-color:#b45309;box-shadow:0 3px 0 #b45309}
.mcard.bad{background:var(--red);color:#fff;border-color:var(--red-d);box-shadow:0 3px 0 var(--red-d)}
.mcard.done{visibility:hidden}
.mgdone{text-align:center;margin-top:14px}
.mgdone .big{font-size:40px}
.mgdone .answer{text-align:left}
.actbar{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:9;display:flex;gap:8px;align-items:stretch;
  max-width:680px;margin:0 auto;padding:8px 12px;background:var(--bg);border-top:2px solid var(--line)}
.actbar>button{flex:1;padding:10px 8px}
.actbar>button.wide{flex:2}
.actbar .undo{flex:0 0 44px;padding:0;font-size:20px}
.actbar .graderow{flex:1}
.actbar kbd{font:inherit;font-size:11px;opacity:.75;margin-left:4px;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.actbar .graderow kbd{margin:0 4px 0 0}
body.hasbar{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.bstat{float:right;font-weight:500;font-size:13px}
.wrongrow{margin:2px 0}
.wrongrow .fw{color:var(--word)}
.keyhelp{font-size:12px;color:#9aa3af;margin:6px 0 0}
.sumbox{text-align:center;margin-top:12px}
.sumbox h2{color:var(--title)}
.sumbox .answer{text-align:left}
.prcard .ttl{font-size:16px}
.prcard .ttlrow{margin-bottom:8px;padding-bottom:6px}
.prcard .prq{padding:10px 14px;font-size:19px}
.prcard .prlive{min-height:52px;padding:8px 12px;margin-top:8px}
.prcard #prIn{margin-top:8px;padding:10px 12px}
.prcard .tylabel{margin:8px 0 4px}
.prcard .btnrow{margin-top:8px}
.prcard .streak{margin-top:6px}
.prcard .lvrow{margin-top:8px}
.prcard .banner{padding:8px 12px;margin-bottom:6px}
.morebox{border-left:3px solid var(--sky);padding-left:12px;margin-top:2px}
/* 폰 화면 (맨 뒤에 둬야 위 규칙보다 우선 적용됨) */
@media (max-width:420px){
  .card{padding:14px}
  .btnrow{gap:8px}
  .btnrow button{flex:1 1 auto;padding:8px 5px;font-size:13px;white-space:nowrap}
  .tblrow{grid-template-columns:1fr 1fr auto}
  .mgrid{grid-template-columns:repeat(2,1fr)}
  .weekdots{margin-left:0}
  .tblrow input[data-tc="ex"]{grid-column:1/3;grid-row:2}
  .tblhead span:nth-child(3){display:none}
  .tblrow{padding-bottom:6px;border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>
<header><h1>업무 영어</h1><span class="ver">v20</span><span class="ver" id="syncStat" style="margin-left:auto"></span></header>
<main id="app"></main>
<div id="actbar" class="actbar"></div>
<nav class="tabs">
  <button data-tab="practice">연습</button>
  <button data-tab="list">단어장</button>
  <button data-tab="add">추가</button>
  <button data-tab="settings">설정</button>
</nav>

<script>
(function () {
  'use strict';

  // ===== 저장 이름표 (브라우저 안에 저장할 때 쓰는 이름) =====
  var LS_ITEMS = 'be_items_v1';
  var LS_SETTINGS = 'be_settings_v1';

  // ===== 작은 도우미 함수들 =====
  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function store(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  // 오늘 날짜 문자열 (offset 만큼 날짜를 더함)
  function dayStr(offset) {
    var d = new Date();
    d.setDate(d.getDate() + (offset || 0));
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  // 화면에 글자를 안전하게 넣기 (<, > 같은 기호가 코드로 실행되지 않게)
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  // 정답 비교용: 대소문자, 마침표·쉼표, 띄어쓰기 차이는 무시
  function norm(s) {
    return String(s || '').toLowerCase()
      .replace(/[’‘`]/g, "'")
      .replace(/[.,!?;:"“”()]/g, '')
      .replace(/\s+/g, ' ').trim();
  }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function str(v) { return String(v == null ? '' : v).trim(); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // 문장 추가 화면의 빈 입력칸
  function emptyForm() { return { en: '', ko: '', key: '', keyKo: '', tip: '', memo: '' }; }

  // 쓸 모델 순서 정하기
  function rankModels(names) {

  // 문장 저장 전 확인. 문제가 있으면 안내 문구를 돌려줌
  function validateSentence(en, ko, key, selfId) {
    if (!en || !ko) return '영어와 한글 뜻을 둘 다 적어 줘.';
    if (findSame(en, selfId)) return '이미 저장된 표현이야. 목록에서 찾아서 수정해 줘.';
    if (key && en.toLowerCase().indexOf(key.toLowerCase()) < 0) return '핵심 표현이 영어 문장 안에 없어. 철자를 확인해 줘.';

  // 단어 예문 → 새 문장 (핵심 표현 = 그 단어, 핵심 뜻 = 단어 뜻)
  function exKeyIn(ex, word) {
    var low = ex.toLowerCase(), w = String(word || '').trim();
    if (!w) return '';
    var i = low.indexOf(w.toLowerCase());
    if (i >= 0) {
      // 단어 중간에서 끊기지 않게 앞뒤로 늘림 (decide → decided)
      var j = i + w.length;
      while (i > 0 && /[A-Za-z'-]/.test(ex.charAt(i - 1))) i--;
      while (j < ex.length && /[A-Za-z]/.test(ex.charAt(j))) j++;
      return ex.slice(i, j);
    }
    // 한 단어면 변형(decide → decided, analysis → analyses)도 찾아봄
    if (!/\s/.test(w) && w.length >= 4) {
      var stem = w.toLowerCase().slice(0, Math.max(4, w.length - 2));
      var toks = ex.match(/[A-Za-z][A-Za-z'-]*/g) || [];
      for (var k = 0; k < toks.length; k++) if (toks[k].toLowerCase().indexOf(stem) === 0) return toks[k];

    return '';
  }
  function addExample(id, si, fi) {

  var deleted = load(LS_DELETED, {}); // 지운 항목 기록 { id: 지운 시각 }

  function syncReason(code) {
    return code === 'token' ? 'GitHub 토큰이 올바르지 않거나 만료됐어. 새 토큰을 넣어 줘.'

  // 화면 위쪽과 설정 카드의 동기화 상태 글자

  // GitHub에 요청 보내기
  async function gh(method, path, body, keepalive) {
    var headers = { 'Authorization': 'Bearer ' + SY.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    var opt = { method: method, headers: headers, cache: 'no-store' };
    if (body) {
      headers['Content-Type'] = 'application/json';
      opt.body = JSON.stringify(body);
      if (keepalive && opt.body.length < 60000) opt.keepalive = true; // 앱을 닫는 순간에도 끝까지 보내기
    }
    var r;
    try { r = await fetch(GH + path, opt); }
    catch (e) { throw { sync: 'net' }; }
    var data = null;
    try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw { sync: r.status === 401 ? 'token' : (r.status === 403 || r.status === 404) ? 'perm' : 'other', status: r.status };
    return data;
  }
  function remoteDoc(items, del, days) {
    return JSON.stringify({ app: 'biz-english', version: 5, updatedAt: new Date().toISOString(), items: items, deleted: del, days: days || ACT });
  }
  // 내 계정의 Gist 중에서 이 앱 파일이 든 것을 찾고, 없으면 새로 만듦 (두 번째 기기부터는 자동으로 찾아짐)
  async function findOrCreateGist() {
    for (var page = 1; page <= 5; page++) {
      var list = await gh('GET', '/gists?per_page=100&page=' + page);
      if (!Array.isArray(list) || !list.length) break;
      var hit = list.find(function (g) { return g.files && g.files[GIST_FILE]; });
      if (hit) return hit.id;
      if (list.length < 100) break;
    }
    var files = {};
    files[GIST_FILE] = { content: remoteDoc(S.items, deleted) };
    var g = await gh('POST', '/gists', { description: '업무 영어 앱 데이터 (자동 동기화, 직접 고치지 마세요)', public: false, files: files });
    return g.id;
  }
  // Gist에서 데이터 읽기. Gist가 사라졌으면 null
  async function readRemote() {
    var g;
    try { g = await gh('GET', '/gists/' + SY.gistId); }
    catch (e) { if (e.status === 404) return null; throw e; }
    var f = g && g.files && g.files[GIST_FILE];
    if (!f) return { items: [], deleted: {} };
    var text = f.content;
    if (f.truncated && f.raw_url) { // 1MB가 넘으면 내용이 잘려서 원본 주소로 다시 받음
      try { text = await (await fetch(f.raw_url, { cache: 'no-store' })).text(); } catch (e) { throw { sync: 'net' }; }
    }
    var d;
    try { d = JSON.parse(text || '{}'); } catch (e) { throw { sync: 'parse' }; }
    return { items: Array.isArray(d.items) ? d.items : [], deleted: d.deleted && typeof d.deleted === 'object' ? d.deleted : {}, days: d.days && typeof d.days === 'object' ? d.days : {} };
  }
  // 두 기기의 데이터를 항목별로 합치기
  function mergeData(li, ld, ri, rd) {
    var del = {};
    [ld, rd].forEach(function (m) {
      Object.keys(m || {}).forEach(function (id) { if (!del[id] || m[id] > del[id]) del[id] = m[id]; });
    });
    var map = {};
    li.concat(ri).forEach(function (it) {
      if (!it || !it.id) return;
      var cur = map[it.id];
      if (!cur || (it.updatedAt || 0) > (cur.updatedAt || 0)) map[it.id] = it; // 더 최근에 고친 쪽이 이김
    });
    var alive = Object.keys(map).map(function (id) { return map[id]; })
      .filter(function (it) { return !(del[it.id] && del[it.id] >= (it.updatedAt || 0)); }); // 지운 뒤에 고친 게 아니면 지움
    // 같은 영어를 두 기기에서 따로 넣었으면 최근에 고친 하나만 남김
    var seen = {}, out = [];
    alive.sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); }).forEach(function (it) {
      var k = norm(it.en);
      if (seen[k]) { del[it.id] = Date.now(); return; }
      seen[k] = 1; out.push(it);
    });
    out.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    var cut = Date.now() - 90 * 864e5; // 90일 지난 삭제 기록은 정리
    Object.keys(del).forEach(function (id) { if (del[id] < cut) delete del[id]; });
    return { items: out, deleted: del };
  }
  // 바뀐 게 있는지 비교하기 위한 지문
  function sig(items, del) {
    var a = items.slice().sort(function (x, y) { return x.id < y.id ? -1 : x.id > y.id ? 1 : 0; });
    var dk = Object.keys(del || {}).sort().map(function (k) { return k + ':' + del[k]; });
    return JSON.stringify(a) + '|' + dk.join(',');
  }
  // 동기화 한 번: 받기 → 합치기 → (달라졌으면) 올리기
  async function syncNow(leaving) {
    if (!SY.token) return;
    if (SY.timer) { clearTimeout(SY.timer); SY.timer = null; }
    if (SY.busy) { SY.again = true; return; }
    SY.busy = true; setSync('busy');
    try {
      if (!SY.gistId) { SY.gistId = await findOrCreateGist(); try { localStorage.setItem(LS_GISTID, SY.gistId); } catch (e) {} }
      var remote = await readRemote();
      if (!remote) { // Gist를 누가 지웠으면 다시 찾거나 만듦
        SY.gistId = await findOrCreateGist(); try { localStorage.setItem(LS_GISTID, SY.gistId); } catch (e) {}
        remote = (await readRemote()) || { items: [], deleted: {} };
      }

      var mSig = sig(m.items, m.deleted);

      if (mSig !== sig(S.items, deleted) || dSig !== canonDays(ACT)) { // 다른 기기에서 바뀐 게 들어옴
        S.items = m.items; deleted = m.deleted; ACT = mDays;
        store(LS_ITEMS, S.items); store(LS_DELETED, deleted); store(LS_DAYS, ACT);
        refreshAfterSync();
      }
      if (mSig !== sig(remote.items, remote.deleted) || dSig !== canonDays(remote.days)) { // 이 기기에서 바뀐 게 있으면 올림

  // 저장할 때마다 바로 보내지 않고 2.5초 모았다가 한 번에

      if (idx[k] == null) { idx[k] = groups.length; groups.push({ pos: k, items: [] }); }
      groups[idx[k]].items.push({ s: s, si: si });
    });
    var n = 0;
    groups.forEach(function (g) {
      h += '<div class="posh">' + esc(POS_LONG[g.pos] || g.pos || '뜻') + '</div>';
      g.items.forEach(function (it) {
        n++;
        var s = it.s;
        h += '<div class="sn"><span class="no">' + n + '.</span><div class="sb">' +
          (editable ? '<button class="small" data-act="sdrop" data-i="' + it.si + '" style="float:right" aria-label="이 뜻 빼기">빼기</button>' : '') +
          '<div class="smain">' + esc(s.koDef || s.en) + '</div>' +
          (s.koDef && s.en ? '<div class="sdef">' + esc(s.en) + '</div>' : '') +
          (s.ex ? '<div class="ex2"><span>' + esc(s.ex) + '</span> ' + exCtl(s.ex) + addEx(s.ex, 'data-i="' + it.si + '"') + (s.exKo ? '<div class="k">' + esc(s.exKo) + '</div>' : '') + '</div>' : '') +
          '</div></div>';
      });
    });
    if (w.forms && w.forms.length) {
      h += '<div class="posh">관련 형태 (참고)</div>';
      w.forms.forEach(function (f, fi) {
        h += '<div class="formrow">' +
          (editable ? '<button class="small" data-act="fdrop" data-i="' + fi + '" style="float:right" aria-label="이 형태 빼기">빼기</button>' : '') +
          '<b class="fw">' + esc(f.word) + '</b>' + (f.pos ? ' <span class="fpos">' + esc(POS_LONG[f.pos] || f.pos) + '</span>' : '') +
          (f.ko ? ' — ' + esc(f.ko) : '') + ' ' + spkBtn(f.word) +
          (f.ex ? '<div class="ex2"><span>' + esc(f.ex) + '</span> ' + exCtl(f.ex) + addEx(f.ex, 'data-f="' + fi + '"') + (f.exKo ? '<div class="k">' + esc(f.exKo) + '</div>' : '') + '</div>' : '') +
          '</div>';
      });
    }
    if (w.tip) h += '<p class="tip">💡 ' + esc(w.tip) + '</p>';
    return h + '</div>';
  }
  function itemEntry(it) { return { word: it.en, ipa: it.ipa, senses: it.senses, forms: it.forms, tip: it.tip }; }

  var SAVE_KEY_HINT = (typeof navigator !== 'undefined' && /Mac|iPhone|iPad/.test(navigator.platform || '') ? '⌘' : 'Ctrl') + ' + Enter로 바로 저장';
  function viewSentence() {

  // ----- 단어장 화면 (목록) -----
  var PAGE = 10; // 한 페이지에 10개씩
  function viewList() {
    return '<section class="card"><h2 class="ttl">업무 영어 단어장</h2>' +
      '<div class="searchbox"><span aria-hidden="true">🔍</span><input type="search" data-list="q" placeholder="단어장에서 검색하기" value="' + esc(S.search) + '"></div>' +
      '<div class="seg sub">' + segBtn('filter', 'all', S.filter, '전체') + segBtn('filter', 'word', S.filter, '단어·숙어') +
      segBtn('filter', 'sentence', S.filter, '문장') + segBtn('filter', 'weak', S.filter, '약점 ' + S.items.filter(isWeak).length) + '</div>' +
      (S.filter === 'weak' ? '<p class="hint" style="margin:8px 0 0">자주 틀리거나 잊는 항목이야. 많이 틀린 순서로 보여. 연습 탭의 "약점만"으로 모아서 연습할 수 있어.</p>' : '') +
      '<div id="listBody"></div></section>';
  }
  function listFiltered() {
    var q = norm(S.search);
    var out = S.items.filter(function (it) {
      if (S.filter === 'weak') { if (!isWeak(it)) return false; }
      else if (S.filter !== 'all' && it.type !== S.filter) return false;
      if (!q) return true;
      var hay = it.en + ' ' + it.ko + ' ' + (it.memo || '') + ' ' + (it.senses || []).map(function (s) { return s.koDef + ' ' + s.en; }).join(' ');
      return norm(hay).indexOf(q) >= 0;
    });
    if (S.filter === 'weak') out.sort(function (a, b) { return weakScore(b) - weakScore(a); });
    return out;
  }
  // 검색할 때 입력칸이 깜빡이지 않게, 목록 부분만 다시 그림
  function renderListBody() {
    var el = document.getElementById('listBody');
    if (!el) return;
    var list = listFiltered();
    if (!list.length) {
      el.innerHTML = '<p class="empty">' + (S.items.length ? '찾는 항목이 없어.' : '아직 저장한 게 없어. 추가 탭에서 넣어 봐.') + '</p>';
      return;
    }
    var pages = Math.max(1, Math.ceil(list.length / PAGE));
    S.page = Math.min(Math.max(1, S.page), pages);
    var slice = list.slice((S.page - 1) * PAGE, S.page * PAGE);
    el.innerHTML = '<ul class="vlist">' + slice.map(rowHTML).join('') + '</ul>' +
      '<div class="pager"><button class="pbtn" data-act="page" data-v="-1"' + (S.page <= 1 ? ' disabled' : '') + ' aria-label="이전 페이지">◀</button>' +
      '<span>' + S.page + ' / ' + pages + '</span>' +
      '<button class="pbtn" data-act="page" data-v="1"' + (S.page >= pages ? ' disabled' : '') + ' aria-label="다음 페이지">▶</button></div>' +
      '<p class="count">총 ' + list.length + '개</p>';
  }
  // 한 줄: "영어 — 뜻" + 🔊 + 📄(자세히 보기)
  function rowHTML(it) {
    var open = !!S.open[it.id];
    var h = '<li class="vrow' + (open ? ' open' : '') + '" data-id="' + it.id + '"><div class="vline">' +
      '<div class="vtext"><b class="vw">' + esc(it.en) + '</b> — ' + esc(meaning(it)) + (isWeak(it) ? ' <span class="duetag weak">약점</span>' : '') + '</div>' +
      '<div class="vbtns">' + (canSpeak ? '<button class="ibtn" data-act="say" data-t="' + esc(it.en) + '" aria-label="발음 듣기">🔊</button>' : '') +
      '<button class="ibtn' + (open ? ' on' : '') + '" data-act="toggle" data-id="' + it.id + '" aria-label="자세히 보기">📄</button></div></div>';
    if (open) h += '<div class="vdetail">' + detailOpenHTML(it) + '</div>';
    return h + '</li>';
  }
  // 펼친 내용: 뜻·예문·팁 + 수정·삭제
  function detailOpenHTML(it) {
    var isW = it.type === 'word';
    if (isW && S.edit && S.edit.id === it.id) return wordEditHTML();
    if (!isW && S.editId === it.id) return sentenceEditHTML(it);
    var armed = S.delArm === it.id, kk = keyKo(it);
    var h = '<span class="tag' + (isW ? ' word' : '') + '">' + (isW ? '단어·숙어' : '문장') + '</span>';
    if (isW) h += (it.senses && it.senses.length) || it.tip || it.ipa || (it.forms && it.forms.length) ? entryHTML(itemEntry(it), false, it.id) : '';
    if (isW && !(it.forms && it.forms.length) && !it.noForms) {
      h += '<div style="margin-top:10px"><button class="small" data-act="findforms" data-id="' + it.id + '"' + (S.formsBusy ? ' disabled' : '') + '>' +
        (S.formsBusy === it.id ? '찾는 중…' : '🔁 관련 형태 찾기 (명사↔동사)') + '</button></div>';
    }
    else h += '<p class="en">' + highlight(it.en, it.key) + ' ' + exCtl(it.en) + '</p><p class="ko">' + esc(it.ko) + '</p>' +
      (it.key ? '<p class="hint">핵심 표현: <b>' + esc(it.key) + '</b>' + (kk ? ' — ' + esc(kk) : '') + '</p>' : '') +
      (it.tip ? '<p class="tip">💡 ' + esc(it.tip) + '</p>' : '');
    return h + (it.memo ? '<p class="memo">' + esc(it.memo) + '</p>' : '') +
      '<p class="meta">맞힘 ' + (it.right || 0) + ' · 틀림 ' + (it.wrong || 0) + ' · 잊은 횟수 ' + (it.lapses || 0) + ' · 기억: ' + memoryText(it) + (it.seen ? ' · 다음 복습 ' + it.due : '') + '</p>' +
      '<div class="actions"><button data-act="edit" data-id="' + it.id + '">수정</button>' +
      '<button class="' + (armed ? 'armed' : 'danger') + '" data-act="del" data-id="' + it.id + '">' +
      (armed ? '한 번 더 누르면 삭제' : '삭제') + '</button></div>';
  }

        '복습할 것이 먼저 나오고, 새 항목은 하루에 이만큼만 섞여 나와. 매일 조금씩 들어와서 전체가 돌아가며 나와.') +

  // =====================================================================
  // ===== 기억 일정 (FSRS: Anki 최신 버전의 기억 예측 방식) =====
  // 항목마다 두 가지를 기록
  //  - 안정도(stab): 기억이 90%로 떨어지기까지 걸리는 날 수. 잘 기억할수록 커짐
  //  - 난이도(diff): 1(쉬움) ~ 10(어려움). 자주 틀리면 올라감
  // 다음 복습 날짜 = "기억할 확률"이 목표 기억률(기본 90%)로 떨어지는 날
  // 등급: 1 다시 / 2 어려움 / 3 알맞음 / 4 쉬움
  //  - 새 항목·다시 배우는 중: 다시 = 3문제 뒤, 어려움 = 6문제 뒤 다시 나옴
  //  - 다시(틀림): 안정도가 크게 줄고, 오늘 안에 맞힐 때까지 다시 나옴
  // =====================================================================
  var GRADE_NAME = ['', '다시', '어려움', '알맞음', '쉬움'];
  // FSRS-4.5 기본값 (많은 사람의 학습 기록으로 맞춘 값)
  var FSRS_W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];
  var F_DECAY = -0.5, F_FACTOR = 19 / 81;
  function retention() { return S.settings.retention || 0.9; }
  // t일 지났을 때 기억하고 있을 확률
  function fR(t, s) { return Math.pow(1 + F_FACTOR * t / Math.max(s, 0.01), F_DECAY); }
  // 기억 확률이 목표 기억률로 떨어지는 날 수
  function fIvl(s) { return Math.min(365, Math.max(1, Math.round(s / F_FACTOR * (Math.pow(retention(), 1 / F_DECAY) - 1)))); }
  function clampD(d) { return Math.min(10, Math.max(1, d)); }
  function fD0(g) { return clampD(FSRS_W[4] - (g - 3) * FSRS_W[5]); }
  function fNextD(d, g) { var nd = d - FSRS_W[6] * (g - 3); return clampD(FSRS_W[7] * fD0(3) + (1 - FSRS_W[7]) * nd); }
  function fSucc(d, s, r, g) {
    var w = FSRS_W;
    return s * (Math.exp(w[8]) * (11 - d) * Math.pow(s, -w[9]) * (Math.exp(w[10] * (1 - r)) - 1) * (g === 2 ? w[15] : 1) * (g === 4 ? w[16] : 1) + 1);
  }
  function fFail(d, s, r) {
    var w = FSRS_W;
    return Math.min(s, w[11] * Math.pow(d, -w[12]) * (Math.pow(s + 1, w[13]) - 1) * Math.exp(w[14] * (1 - r)));
  }
  function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5); }
  function isNewItem(it) { return !it.seen; }
  // 약점: 2번 이상 잊었거나, 맞힌 것보다 틀린 게 많거나, 난이도가 높은 것
  function isWeak(it) {
    return (it.lapses || 0) >= 2 || ((it.wrong || 0) >= 3 && it.wrong > (it.right || 0)) || (!!it.seen && (it.diff || 0) >= 8);
  }
  function weakScore(it) { return (it.lapses || 0) * 3 + (it.wrong || 0) - (it.right || 0) * 0.5 + ((it.diff || 5) - 5); }
  // 지금 기억하고 있을 확률 (0~1)
  function recallNow(it) {
    if (!it.seen || !it.stab) return 0;
    return fR(Math.max(0, it.lastRev ? daysBetween(it.lastRev, dayStr()) : 0), it.stab);
  }
  // 등급을 골랐을 때의 다음 상태
  // repeated: 이번 연습에서 이미 한 번 다시 나온 항목인지 (그러면 또 틀려도 오늘은 더 안 나오고 내일로)
  function nextState(it, g, repeated) {
    var today = dayStr();
    var s = { stab: it.stab || 0, diff: it.diff || 0, learn: !!it.learn || !it.seen, lapses: it.lapses || 0, reps: it.reps || 0, again: 0, days: 0 };
    if (!s.stab) { s.stab = FSRS_W[g - 1]; s.diff = fD0(g); } // 처음 보는 항목
    else if (!it.lastRev || it.lastRev < today) { // 지난번 이후 하루 이상 지남: 공식으로 갱신
      var t = it.lastRev ? daysBetween(it.lastRev, today) : Math.max(1, it.ivl || 1);
      var r = fR(t, s.stab);
      if (g === 1) { s.stab = fFail(s.diff, s.stab, r); if (!s.learn) s.lapses++; }
      else s.stab = fSucc(s.diff, s.stab, r, g);
      s.diff = fNextD(s.diff, g);
    } else if (g === 1 && !s.learn) { s.lapses++; s.stab = fFail(s.diff, s.stab, 1); s.diff = fNextD(s.diff, 1); } // 오늘 이미 맞힌 걸 다시 틀림
    if (g === 1) {
      s.learn = true;
      if (repeated) s.days = 1;            // 이번 연습에서 두 번째로 틀림: 오늘은 그만, 내일 다시
      else { s.again = 4; s.days = 0; }    // 4문제 뒤에 한 번 더
    } else { s.learn = false; s.reps++; s.days = fIvl(s.stab); } // 어려움·알맞음·쉬움: 오늘은 끝 (어려움도 다시 돌지 않음)
    return s;
  }
  // 4개 등급의 다음 간격 (어려움 ≤ 알맞음 < 쉬움이 되게 맞춤)
  function gradeDays(it, repeated) {
    var d = [0, 0, 0, 0, 0];
    for (var g = 1; g <= 4; g++) d[g] = nextState(it, g, repeated).days;
    if (d[2] && d[3] && d[2] > d[3]) d[2] = d[3];
    if (d[3] && d[2] && d[3] < d[2]) d[3] = d[2];
    if (d[4] && d[3] && d[4] <= d[3]) d[4] = d[3] + 1;
    return d;
  }
  function daysLabel(d) {
    return !d ? '오늘 다시' : d < 30 ? d + '일 뒤' : d < 365 ? Math.round(d / 30) + '달 뒤' : '1년 뒤';
  }
  // 기억 상태를 쉬운 말로 (단어장에 표시)
  function memoryText(it) {
    if (!it.seen) return '새 항목';
    if (it.learn) return '배우는 중';
    return '지금 기억할 확률 ' + Math.round(recallNow(it) * 100) + '% · 안정도 ' + (Math.round((it.stab || 0) * 10) / 10) + '일';
  }

  // 연습 순서 (단어장 전체를 골고루)

  //  2) 그다음 이미 배운 것 중 오늘 아직 안 본 것 (기억할 확률이 낮은 것부터)
  //  3) 1)·2) 사이사이에 새 항목 (2개마다 1개, 하루 새 항목 수까지)

    var jitter = {}; list.forEach(function (it) { jitter[it.id] = Math.random() * 0.06; }); // 같은 순서로 고정되지 않게 살짝 섞음

    return (it.reps || 0) % 3 === 2 ? 'rev' : 'type';
  }
  // 등급 적용 (처음 고를 때 상태를 기억해 두고, 다른 등급으로 바꾸면 되돌린 뒤 다시 적용)
  function gradeCard(g) {
    var p = S.pr, it = prCur();
    if (!p || !it || p.retry) return;
    resetDaily();
    if (p.snap) {
      SRS_KEYS.forEach(function (k) { it[k] = p.snap.it[k]; });
      S.settings.newDone = p.snap.newDone; S.settings.revDone = p.snap.revDone;
      if (p.req != null && p.order[p.req] === it.id) { p.order.splice(p.req, 1); if (p.req < p.planned) p.planned--; }
      if (p.reqMarked) { delete p.requeued[it.id]; p.reqMarked = false; }
      p.req = null;
    } else {
      p.snap = { it: srsSnap(it), newDone: S.settings.newDone || 0, revDone: S.settings.revDone || 0, orderBefore: p.order.slice() };
      bumpActivity(1); // 연속 학습일 기록
    }
    p.requeued = p.requeued || {};
    var r = applyGrade(it, g, !!p.requeued[it.id]);
    if (r.wasNew) S.settings.newDone = (S.settings.newDone || 0) + 1; else S.settings.revDone = (S.settings.revDone || 0) + 1;
    saveSettings();
    p.grade = g; p.again = r.again;
    // 다시·어려움(배우는 중): 몇 문제 뒤에 한 번 더
    if (r.again) {
      p.req = Math.min(p.idx + r.again, p.order.length);
      p.order.splice(p.req, 0, it.id);
      if (p.req < p.planned) p.planned++; // "오늘 할 것" 안에 끼워 넣었으면 끝 위치도 한 칸 뒤로
      p.requeued[it.id] = true; p.reqMarked = true;
    }
    persist();
  }


  // ----- 힌트 모양 -----
  // 쉬움: C____ y__ p_____ / 보통: _____ ___ (글자 수만) / 어려움: 없음
  // 힌트 버튼을 누를 때마다 앞에서부터 단어를 하나씩 공개
  function prSkeleton(it, level, hints) {
    var ws = words(it.en);
    if (level === 'hard' && !hints) return '';
    var out = [];
    for (var i = 0; i < ws.length; i++) {
      var w = ws[i];
      if (i < hints || /^\[[^\]]*\]/.test(w)) out.push(w);
      else if (level === 'easy') out.push(w.charAt(0) + w.slice(1).replace(/[A-Za-z]/g, '_'));
      else if (level === 'normal') out.push(w.replace(/[A-Za-z0-9]/g, '_'));
      else { out.push('…'); break; }
    }
    return out.join('  ');
  }

  // ----- 치는 동안 표시 -----
  // 단어마다 색 표시 (초록 = 맞음, 빨강 = 틀림), 그 아래에 난이도 힌트
  function prLiveHTML(it, p) {
    var tw = words(p.input), gw = words(plainEn(it.en)), ended = /\s$/.test(p.input);
    var sk = prSkeleton(it, S.settings.prLevel || 'easy', p.hints);
    var typed = tw.map(function (w, i) {
      var g = gw[i] != null ? wnorm(gw[i]) : null, t = wnorm(w), cls;
      var complete = i < tw.length - 1 || ended; // 띄어쓰기를 쳐서 끝난 단어인지
      if (g == null) cls = 'bad';
      else if (complete) cls = t === g ? 'ok' : 'bad';
      else cls = g.indexOf(t) === 0 ? '' : 'bad'; // 치는 중인 단어는 앞부분이 맞으면 그대로
      return '<span class="w ' + cls + '">' + esc(w) + '</span>';
    }).join(' ');
    return (typed ? '<div>' + typed + '</div>' : '') +
      (sk ? '<div class="prsk">' + esc(sk) + '</div>' : (typed ? '' : '<div class="tyline"></div>'));
  }
  // 아래쪽 한 줄: 정확도 · 속도 · 남은 문장
  function tyFootText(it, p) {
    var acc = '–', wpm = 0;
    if (p.checked) { acc = p.checked.acc + '%'; wpm = p.checked.wpm; }
    else if (p.input.trim()) {
      var a = norm(p.input), b = norm(plainEn(it.en)).slice(0, a.length); // 친 데까지만 비교
      acc = Math.max(0, Math.round((1 - lev(a, b) / Math.max(a.length, 1)) * 100)) + '%';
      var sec = p.start ? (Date.now() - p.start) / 1000 : 0;
      wpm = sec > 1 ? Math.round(p.input.trim().length / 5 / (sec / 60)) : 0;
    } else if (p.last) { acc = p.last.acc + '%'; wpm = p.last.wpm; }
    return '정확도 <b>' + acc + '</b>　속도 <b>' + wpm + ' WPM</b>　남은 문장 <b>' + Math.max(0, p.order.length - p.idx - 1) + '</b>';
  }
  // 타이핑할 때 화면 전체를 다시 그리지 않고 이 두 곳만 바꿈 (입력칸이 깜빡이지 않게)
  function prLiveUpdate() {
    var it = tyItem(), p = tyState();
    if (!it || !p) return;
    var a = document.getElementById('prLive'); if (a) a.innerHTML = prLiveHTML(it, p);
    var b = document.getElementById('prStat'); if (b) b.innerHTML = tyFootText(it, p);
  }

  // ----- 채점 -----
  // 두 글자열이 얼마나 다른지 (글자를 몇 번 고치면 같아지는지)
  function lev(a, b) {
    var prev = [], cur, i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      cur = [i];
      for (j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length];
  }
  // 단어 단위로 정답과 내 답을 맞춰 봄 (어느 단어가 빠졌고 틀렸는지)
  function wordDiff(tw, gw) {
    var n = tw.length, m = gw.length, L = [], i, j;
    for (i = 0; i <= n; i++) { L[i] = []; for (j = 0; j <= m; j++) L[i][j] = 0; }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--)
      L[i][j] = wnorm(tw[i]) === wnorm(gw[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    var tOk = [], gOk = [];
    i = 0; j = 0;
    while (i < n && j < m) {
      if (wnorm(tw[i]) === wnorm(gw[j])) { tOk[i] = gOk[j] = true; i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) i++;
      else j++;
    }
    return { t: tOk, g: gOk };
  }
  // 정답 확인. 정확도는 글자 기준, 속도 WPM = 1분에 친 단어 수 (5글자를 1단어로 셈)
  // 아무것도 안 치고 "정답 확인"을 누르면 정답을 보여 주고 "다시"로 기록
  function tyCheck() {
    var p = tyState(), it = tyItem();
    if (!p || !it || p.checked) return;
    var gaveUp = !p.input.trim();
    var a = canon(p.input), b = canon(plainEn(it.en)); // [고객사] 같은 칸은 빼고, 표기 차이는 맞춰서 비교
    var perfect = sameAnswer(p.input, plainEn(it.en));
    var acc = perfect ? 100 : Math.max(0, Math.round((1 - lev(a, b) / Math.max(a.length, b.length, 1)) * 100));
    var sec = p.start ? Math.max(1, (Date.now() - p.start) / 1000) : 0;
    var len = p.input.trim().length;
    var spellNote = perfect && norm(p.input) !== norm(plainEn(it.en));
    if (gaveUp) { acc = 0; perfect = false; }
    var ok = !gaveUp && (perfect || acc >= 90) && !p.show;
    p.checked = {
      acc: acc, perfect: perfect, ok: ok, gaveUp: gaveUp, sec: Math.round(sec), spellNote: spellNote,
      wpm: sec ? Math.round(len / 5 / (sec / 60)) : 0, cpm: sec ? Math.round(len / (sec / 60)) : 0
    };
    p.log[it.id] = { acc: acc, wpm: p.checked.wpm };
    p.last = { acc: acc, wpm: p.checked.wpm };
    if (!p.retry) p.suggest = suggestGrade(p.checked, p, it); // 추천 등급은 표시만. 등급을 누르거나 Enter를 누르면 적용하고 다음으로
    render();
    if (S.settings.autoSpeak !== false) speak(it.en); // 채점 뒤 정답 발음
  }
  // 자동 추천 등급: 틀림·모름·문장 보기 = 다시 / 힌트·작은 실수 = 어려움 / 완벽 = 알맞음 / 완벽하고 빠르면 = 쉬움
  function suggestGrade(c, p, it) {
    if (c.gaveUp || p.show || !c.ok) return 1;
    if (!c.perfect || p.hints > 0) return 2;
    var len = plainEn(it.en).length;
    if ((len <= 15 && c.sec <= 4) || (len > 15 && c.cpm >= 200)) return 4;
    return 3;
  }
  // 문장은 핵심 표현만, 없으면 가장 긴 단어를 읽어 줌
  function prKeyText(it) { return it.type === 'word' ? it.en : (it.key || blankInfo(it).answer); }

  // 기억 정도 버튼 4개 (추천 등급이 빨갛게, 눌러서 바꿀 수 있음)
  function gradeRowHTML(it, p) {
    if (p.retry) return '<p class="hint">다시 하기는 기록에 안 들어가.</p>';
    var base = p.snap ? p.snap.it : srsSnap(it), gd = gradeDays(base, !!(p.requeued && p.requeued[it.id]));
    return '<div class="gradebox"><div class="hint" style="margin-bottom:6px">얼마나 잘 기억했어? ' +
      (p.suggest && p.kind !== 'rev' ? '(추천: <b>' + GRADE_NAME[p.suggest] + '</b> · 다르면 눌러서 바꿔. 키보드 1~4)' : '(키보드 1~4)') + '</div>' +
      '<div class="graderow">' + [1, 2, 3, 4].map(function (g) {
        return '<button class="g' + g + (p.grade === g ? ' on' : '') + '" data-act="prgrade" data-v="' + g + '">' + GRADE_NAME[g] +
          '<small>' + daysLabel(gd[g]) + '</small></button>';
      }).join('') + '</div>' +
      (p.grade && p.again ? '<p class="hint" style="margin:6px 0 0">' + p.again + '문제 뒤에 한 번 더 나와.</p>' : '') + '</div>';
  }
  // 이 카드가 왜 나왔는지 표시
  function cardTag(it, p) {
    var t;
    if (!it.seen && !p.snap) t = '<span class="duetag new">새 항목</span>';
    else if ((p.snap ? p.snap.it.learn : it.learn)) t = '<span class="duetag again">다시 보기</span>';
    else if ((p.snap ? p.snap.it.due : it.due) <= dayStr()) t = '<span class="duetag">복습</span>';
    else t = '<span class="duetag extra">추가 연습</span>';
    return t + (isWeak(it) ? '<span class="duetag weak">약점</span>' : '');
  }

  // ===== 표기 차이는 정답으로 인정 (하이픈·띄어쓰기, 영국식·미국식 철자, 축약형) =====
  var SPELL_MAP = {
    defence: 'defense', licence: 'license', offence: 'offense', programme: 'program', programmes: 'programs',
    catalogue: 'catalog', dialogue: 'dialog', grey: 'gray', aluminium: 'aluminum', enquiry: 'inquiry', enquiries: 'inquiries',
    enquire: 'inquire', judgement: 'judgment', ageing: 'aging', acknowledgement: 'acknowledgment',
    centre: 'center', centres: 'centers', metre: 'meter', metres: 'meters', litre: 'liter', litres: 'liters', theatre: 'theater', fibre: 'fiber',
    cancelled: 'canceled', cancelling: 'canceling', travelled: 'traveled', travelling: 'traveling', labelled: 'labeled', labelling: 'labeling',
    modelled: 'modeled', modelling: 'modeling', fuelled: 'fueled', signalled: 'signaled', totalled: 'totaled', levelled: 'leveled',
    cannot: 'can not', "can't": 'can not', "won't": 'will not', "shan't": 'shall not', "let's": 'let us'
  };
  var OUR_KEEP = { four: 1, hour: 1, your: 1, pour: 1, sour: 1, tour: 1, flour: 1, devour: 1, detour: 1, contour: 1 };
  function canonWord(w) {
    if (SPELL_MAP[w]) return SPELL_MAP[w];
    w = w.replace(/n't$/, ' not').replace(/'ll$/, ' will').replace(/'re$/, ' are').replace(/'ve$/, ' have').replace(/'m$/, ' am');
    w = w.replace(/is(e|ed|es|ing|ation|ations)$/, 'iz$1').replace(/ys(e|ed|es|ing)$/, 'yz$1'); // organise → organize, analyse → analyze
    if (w.length >= 5 && /our(s|ed|ing|able)?$/.test(w) && !OUR_KEEP[w.replace(/(s|ed|ing|able)$/, '')]) w = w.replace(/our(s|ed|ing|able)?$/, 'or$1'); // colour → color
    return w;
  }
  function canon(s) {
    return norm(s).replace(/[-–—/]/g, ' ').split(/\s+/).filter(Boolean).map(canonWord).join(' ').replace(/\s+/g, ' ').trim();
  }
  // 띄어쓰기까지 무시하고 같으면 정답 (follow-up = follow up = followup, e-mail = email)
  function sameAnswer(a, b) { return canon(a).replace(/\s/g, '') === canon(b).replace(/\s/g, ''); }

  // ===== 되돌리기 (Ctrl+Z) =====
  // 다음 문제로 넘어갈 때마다 "넘어가기 전 상태"를 기록해 두고, 되돌리면 그대로 복원
  function pushHist() {
    var p = S.pr, it = prCur();
    if (!p || !it) return;
    p.hist = p.hist || [];
    p.hist.push({
      order: (p.snap && p.snap.orderBefore ? p.snap.orderBefore : p.order).slice(), idx: p.idx, id: it.id,
      srs: p.snap ? p.snap.it : null, nd: p.snap ? p.snap.newDone : null, rd: p.snap ? p.snap.revDone : null,
      state: { input: p.input, start: p.start, checked: p.checked, show: p.show, hints: p.hints, kind: p.kind, revealed: p.revealed, suggest: p.suggest, retry: p.retry, again: p.again },
      stat: p.grade ? true : false, requeued: JSON.parse(JSON.stringify(p.requeued || {})), reqMarked: p.reqMarked,
      planned: p.planned - (p.req != null && p.req < p.planned ? 1 : 0)
    });
    if (p.hist.length > 30) p.hist.shift();
  }
  function prUndo() {
    var p = S.pr;
    if (!p || !p.hist || !p.hist.length) return;
    var h = p.hist.pop(), it = getItem(h.id);
    if (it && h.srs) { SRS_KEYS.forEach(function (k) { it[k] = h.srs[k]; }); touch(it); }
    if (h.nd != null) { S.settings.newDone = h.nd; S.settings.revDone = h.rd; saveSettings(); }
    if (h.stat && p.stats && p.stats.length) p.stats.pop();
    p.order = h.order; p.idx = h.idx;
    if (h.planned != null) p.planned = h.planned;
    if (h.requeued) { p.requeued = h.requeued; if (h.reqMarked) delete p.requeued[h.id]; }
    prReset();
    Object.assign(p, h.state); // 채점한 화면으로 돌아감. 등급은 다시 고르면 돼
    p.snap = null; p.grade = 0; p.req = null;
    if (p.summary) { p.summary = false; p.ended = false; }
    persist();
    stopLoop();
    render();
  }
  // 등급을 고르면 바로 다음 문제로 (등급이 연습의 마지막 단계)
  function gradeAndNext(g) {
    var p = S.pr;
    if (!p || p.retry) { prMove(1); return; }
    if (!(p.checked || p.revealed)) return;
    gradeCard(g);
    prMove(1);
  }
  // Enter: 채점 전이면 정답 확인, 채점 뒤면 추천 등급(또는 고른 등급)으로 다음
  function prEnter() {
    var p = S.pr;
    if (!p) return;
    if (p.kind === 'rev') { if (!p.revealed) { p.revealed = true; render(); } else gradeAndNext(p.grade || 3); return; }
    if (!p.checked) { tyCheck(); return; }
    if (p.retry) { prMove(1); return; }
    gradeAndNext(p.grade || p.suggest || 3);
  }

  // ===== 아래 고정 버튼 바 =====
  function actionBarHTML() {
    if (S.tab !== 'practice' || !S.pr || (S.settings.prMode || 'today') === 'match' || S.pr.summary) return '';
    var p = S.pr, it = prCur();
    if (!it) return '';
    var undo = p.hist && p.hist.length ? '<button class="undo" data-act="prundo" title="되돌리기 (Ctrl+Z)">↶</button>' : '';
    var graded = (p.kind === 'rev' && p.revealed) || (p.kind !== 'rev' && p.checked);
    if (graded && !p.retry) {
      var base = p.snap ? p.snap.it : srsSnap(it), gd = gradeDays(base, !!(p.requeued && p.requeued[it.id])), pick = p.grade || p.suggest || 0;
      return undo + '<div class="graderow">' + [1, 2, 3, 4].map(function (g) {
        return '<button class="g' + g + (pick === g ? ' on' : '') + '" data-act="prgrade" data-v="' + g + '">' +
          '<kbd>' + g + '</kbd>' + GRADE_NAME[g] + '<small>' + daysLabel(gd[g]) + '</small></button>';
      }).join('') + '</div>';
    }
    if (graded && p.retry) return undo + '<button class="on wide" data-act="prnext">다음 문장 ▶ <kbd>Enter</kbd></button>';
    return undo + '<button data-act="prprev">◀ 이전</button>' +
      (p.kind === 'rev' ? '<button class="on wide" data-act="prreveal">👀 뜻 확인 <kbd>Enter</kbd></button>'
        : '<button class="on wide" data-act="prcheck">✔ 정답 확인 <kbd>Enter</kbd></button>') +
      '<button data-act="prnext">다음 ▶</button>';
  }
  var KEY_HELP = '<p class="keyhelp">⌨ Enter 확인·다음 · 1~4 등급 · 5 발음 · 6 단어만 · 7 천천히 · 8 문장 보기 · 9 힌트 · 0 뜻 수정 · Esc 모르겠음 · Ctrl+Z 되돌리기</p>';

  // ===== 오늘 끝 요약 화면 =====
  // 오늘 끝 / 지금 연습할 게 없음 화면
  // - 오늘 할 것(복습 + 새 항목)을 끝냈을 때, 순서 끝까지 갔을 때, 처음부터 할 게 없을 때 모두 여기로 와
  function nextDueInfo() {
    var today = dayStr(), min = null, n = 0;
    S.items.forEach(function (it) {
      if (!it.seen || it.learn || it.due <= today) return;
      if (min == null || it.due < min) { min = it.due; n = 1; } else if (it.due === min) n++;
    });
    if (!min) return '';
    var d = daysBetween(today, min);
    return '다음 복습은 ' + (d === 1 ? '내일' : d + '일 뒤') + ' ' + n + '개야.';
  }
  function summaryHTML() {
    var p = S.pr, st = p.stats || [], n = st.length, mode = S.settings.prMode || 'today';
    var cnt = [0, 0, 0, 0, 0], acc = 0, accN = 0, wrong = {}, learned = 0;
    st.forEach(function (s) { cnt[s.g]++; if (s.acc != null) { acc += s.acc; accN++; } if (s.g === 1) wrong[s.id] = 1; if (s.isNew && s.g >= 3) learned++; });
    var wrongItems = Object.keys(wrong).map(getItem).filter(Boolean);
    var si = streakInfo();
    var newLeftAll = S.items.filter(isNewItem).length, nd = S.settings.newDone || 0, lim = newLimit();
    var moreLeft = p.order.length > p.idx + 1 && !p.ended;
    var title = !n ? (mode === 'weak' ? '약점으로 연습할 게 없어 👍' : '지금 연습할 게 없어') : mode === 'weak' ? '약점 한 바퀴 끝! 💪' : '오늘 할 걸 다 했어! 🎉';
    // 왜 없는지 쉬운 말로
    var why = [];
    if (mode === 'today') {
      why.push('복습할 차례인 항목은 다 했어.');
      if (newLeftAll) why.push(nd >= lim ? '오늘 새 항목 ' + lim + '개를 다 배웠어 (남은 새 항목 ' + newLeftAll + '개).' : '');
      else why.push('새로 배울 항목도 없어.');
    }
    var nx = nextDueInfo();
    if (nx) why.push(nx);
    return '<div class="sumbox"><h2>' + title + '</h2>' +
      (n ? '<div class="row" style="margin-top:6px"><div><div class="big">' + n + '</div><div class="hint">푼 문제</div></div>' +
        '<div><div class="big">' + (accN ? Math.round(acc / accN) : '–') + (accN ? '%' : '') + '</div><div class="hint">평균 정확도</div></div>' +

  // ===== 백업 =====
  function exportData() {
    var data = { app: 'biz-english', version: 7, exportedAt: new Date().toISOString(), items: S.items };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'biz-english-backup-' + dayStr() + '.json';

  // 가져오기: 이 앱 백업, 그리고 원래 회사 단어장 백업(word, senses 모양)도 읽음
  function importFile(file) {
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result);
        var arr = Array.isArray(d) ? d : d.items;
        if (!Array.isArray(arr)) throw new Error('형식');
        var added = 0, skipped = 0;
        arr.forEach(function (x) {
          if (!x) return;
          var fromOld = !x.en && x.word; // 원래 회사 단어장 백업
          if (fromOld && x.lang === 'ko') { skipped++; return; } // 국어 단어는 이 앱에서 안 씀
          var en = str(x.en || x.word);
          var senses = Array.isArray(x.senses) ? x.senses.map(function (s) {
            return { pos: str(s.pos), koDef: str(s.koDef), en: str(s.en), ex: str(s.ex), exKo: str(s.exKo) };
          }) : [];
          var ko = str(x.ko) || senses.map(function (s) { return s.koDef; }).filter(Boolean).slice(0, 3).join(', ');
          if (!en || !ko || findSame(en)) { skipped++; return; }
          var type = x.type === 'sentence' ? 'sentence' : 'word';
          S.items.push(newItem(type, {
            id: x.id && !fromOld ? x.id : uid(), en: en, ko: ko, key: type === 'sentence' ? str(x.key) : '', keyKo: type === 'sentence' ? str(x.keyKo) : '',
            tip: str(x.tip), memo: str(x.memo), ipa: str(x.ipa), senses: type === 'word' ? senses : [], forms: type === 'word' ? cleanForms(x.forms, en) : [],
            createdAt: x.createdAt || Date.now(), level: fromOld ? 0 : (x.level | 0), due: fromOld ? dayStr() : (x.due || dayStr()),
            right: x.right | 0, wrong: fromOld ? (x.miss | 0) : (x.wrong | 0),
            seen: !fromOld && x.seen != null ? !!x.seen : (x.right | 0) + (x.wrong | 0) > 0, learn: !!x.learn,
            ease: x.ease || 2.5, ivl: x.ivl | 0, reps: x.reps | 0, lapses: x.lapses | 0, lastSeen: x.lastSeen || 0,
            stab: x.stab != null ? +x.stab : undefined, diff: x.diff != null ? +x.diff : undefined, lastRev: x.lastRev || ''
          }));
          added++;
        });
        persist();
        alert(added + '개를 가져왔어.' + (skipped ? ' 이미 있거나 쓸 수 없는 ' + skipped + '개는 건너뛰었어.' : ''));
        render();
      } catch (e) {
        alert('백업 파일을 읽지 못했어. 내보내기로 만든 파일인지 확인해 줘.');
      }
    };
    rd.readAsText(file);
  }

  // ===== 버튼 누름, 글자 입력 처리 =====
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-tab]');
    if (!t || t.disabled) return;
    if (t.dataset.tab) {
      stopLoop();
      S.tab = t.dataset.tab; S.msg = ''; S.editId = null; S.edit = null; S.delArm = null;
      render(); window.scrollTo(0, 0);
      return;
    }
    var id = t.dataset.id, v = t.dataset.v;
    switch (t.dataset.act) {
      // 추가 화면
      case 'atype': S.addType = v; S.msg = ''; render(); break;
      case 'wmode': S.wordMode = v; S.msg = ''; render(); break;
      case 'lookup': lookup(); break;
      case 'savefound': saveFound(false); break;
      case 'overwrite': saveFound(true); break;
      case 'discard': S.found = null; S.msg = ''; render(); break;
      case 'sdrop': if (S.found) { S.found.senses.splice(Number(t.dataset.i), 1); render(); } break;
      case 'fdrop': if (S.found && S.found.forms) { S.found.forms.splice(Number(t.dataset.i), 1); render(); } break;
      case 'bulkgo': bulkLookup(); break;
      case 'bdrop': S.bulk.results.splice(Number(t.dataset.i), 1); render(); break;
      case 'bulksave': bulkSaveAll(); break;
      case 'photoclear': S.photoUrl = ''; render(); break;
      case 'tblparse': tblParseTyped(); break;
      case 'tbldrop': S.tbl.rows.splice(Number(t.dataset.i), 1); render(); break;
      case 'tblclear': S.tbl.rows = []; S.msg = ''; render(); break;
      case 'tblsave': tblSave(); break;
      case 'mask': maskDecide(t.dataset.n, v); break;
      case 'maskdel': delete MASK[t.dataset.n]; saveMasks(); render(); break;
      case 'maskall':
        S.maskRun = true; S.msg = '';
        if (maskAllPending().length) { setMsg('처음 보는 이름이 있어. 위에서 하나씩 정하면 바로 적용돼.', 'info'); }
        else maskAll();
        break;
      case 'auto': autoFill(); break;
      case 'savesentence': saveSentence(); break;
      case 'addmore': S.settings.addMore = !S.settings.addMore; saveSettings(); render(); break;
      // 발음
      case 'say': speak(t.dataset.t); break;
      case 'loop': toggleLoop(t.dataset.t, t); break;
      // 단어장 화면
      case 'filter': S.filter = v; S.page = 1; render(); break;
      case 'page': S.page += Number(v); S.open = {}; S.edit = null; S.editId = null; renderListBody(); break;
      case 'toggle': S.open[id] = !S.open[id]; if (!S.open[id]) { if (S.edit && S.edit.id === id) S.edit = null; if (S.editId === id) S.editId = null; } renderListBody(); break;
      case 'edit': startEdit(id); break;
      case 'edsadd': collectEdit(); S.edit.draft.senses.push({ pos: '', koDef: '', en: '', ex: '', exKo: '' }); renderListBody(); break;
      case 'edsdrop': collectEdit(); S.edit.draft.senses.splice(Number(t.dataset.i), 1); renderListBody(); break;
      case 'edfadd': collectEdit(); (S.edit.draft.forms = S.edit.draft.forms || []).push({ word: '', pos: '', ko: '', ex: '', exKo: '' }); renderListBody(); break;
      case 'edfdrop': collectEdit(); S.edit.draft.forms.splice(Number(t.dataset.i), 1); renderListBody(); break;
      case 'findforms': findForms(id); break;
      case 'addex': addExample(id, t.dataset.i != null ? +t.dataset.i : null, t.dataset.f != null ? +t.dataset.f : null); break;
      case 'edsave': saveWordEdit(); break;
      case 'edcancel': S.edit = null; renderListBody(); break;
      case 'cancelEdit': S.editId = null; renderListBody(); break;
      case 'saveSentEdit': saveSentEdit(id); break;
      case 'del':
        if (S.delArm === id) {
          S.items = S.items.filter(function (x) { return x.id !== id; });
          markDeleted(id); // 다른 기기에서도 지워지게 기록
          S.delArm = null; delete S.open[id]; persist();
        } else {
          S.delArm = id;
          setTimeout(function () { if (S.delArm === id) { S.delArm = null; renderListBody(); } }, 3000);
        }
        renderListBody();
        break;
      // 설정 화면
      case 'export': exportData(); break;
      case 'ghsave':
        var ti = document.getElementById('ghTokenInput');
        SY.token = ti ? ti.value.trim() : '';
        SY.gistId = ''; // 새 토큰이면 Gist를 다시 찾음
        try {
          localStorage.removeItem(LS_GISTID);
          if (SY.token) localStorage.setItem(LS_GHTOKEN, SY.token); else localStorage.removeItem(LS_GHTOKEN);
        } catch (err) {}
        render();
        if (SY.token) syncNow(); else setSync('off');
        break;
      case 'ghsync': syncNow(); break;
      case 'ghoff':
        SY.token = ''; SY.gistId = '';
        try { localStorage.removeItem(LS_GHTOKEN); localStorage.removeItem(LS_GISTID); } catch (err) {}
        setSync('off'); render();
        break;
      case 'gemsave':
        var inp = document.getElementById('gemKeyInput');
        S.gemKey = inp ? inp.value.trim() : '';
        try {
          if (S.gemKey) localStorage.setItem(LS_GEMKEY, S.gemKey); else localStorage.removeItem(LS_GEMKEY);
          localStorage.removeItem(LS_GEMMODELS); // 키가 바뀌면 모델 목록도 새로
        } catch (err) {}
        S.gemDiag = '';
        if (S.gemKey) gemTest(); else { S.gemResult = '키를 지웠어.'; S.gemOK = true; render(); }
        break;
      case 'gemtest': gemTest(); break;
      case 'gemq':
        S.gemQuality = v === '1';
        try { localStorage.setItem(LS_GEMQ, S.gemQuality ? '1' : '0'); } catch (err) {}
        S.gemResult = ''; render();
        break;
      // 연습
      case 'prlv': S.settings.prLevel = v; saveSettings(); render(); break;
      case 'prf': S.settings.prFilter = v; saveSettings(); prNew(); render(); break;
      case 'prmode': S.settings.prMode = v; saveSettings(); if (v === 'match') mgNew(); else prNew(); render(); break;
      case 'mgpick': mgPick(Number(t.dataset.i)); break;
      case 'mgnew': mgNew(); render(); break;
      case 'mgreview':
        S.mg.pairs.forEach(function (pp) { if (S.mg.miss[pp.id]) { var x = getItem(pp.id); if (x && x.seen && x.due > dayStr()) { x.due = dayStr(); touch(x); } } });
        persist(); S.mg.missQueued = true; setMsg('헷갈린 것을 오늘 복습에 넣었어. "오늘 공부"에서 나와.', 'ok');
        break;
      case 'prshuffle': prNew(true); render(); break;
      case 'prgrade': gradeAndNext(Number(v)); break;
      case 'prreveal': S.pr.revealed = true; render(); if (S.settings.autoSpeak !== false && prCur()) speak(prCur().en); break;
      case 'prundo': prUndo(); break;
      case 'prwrongagain':
        var wr = {}; (S.pr.stats || []).forEach(function (s) { if (s.g === 1) wr[s.id] = 1; });
        S.pr.order = Object.keys(wr).filter(getItem).concat(S.pr.order.slice(S.pr.idx)); S.pr.idx = 0; S.pr.summary = false; S.pr.planned = Object.keys(wr).length;
        prReset(); render(); break;
      case 'prcontinue': S.pr.summary = false; render(); break;
      case 'prfree': // 자유 연습: 배운 것 전부, 기억할 확률이 낮은 것부터 (오늘 본 것도 포함)
        var keepSt = S.pr ? S.pr.stats : [];
        var fl = prList().filter(function (x) { return x.seen; }).sort(function (a, b) { return recallNow(a) - recallNow(b); });
        S.pr = Object.assign(newT(), { order: fl.map(function (x) { return x.id; }), planned: 0, idx: 0, log: {}, last: null, builtAt: Date.now(), stats: keepSt, summaryShown: true, free: true });
        S.settings.prMode = 'today'; saveSettings(); render(); break;
      case 'prmorenew': resetDaily(); S.settings.newExtra = (S.settings.newExtra || 0) + 10; saveSettings(); prNew(); render(); break;
      case 'prsay': var a1 = tyItem(); if (a1) speak(a1.en); break;
      case 'prkey': var a2 = tyItem(); if (a2) speak(prKeyText(a2)); break;
      case 'prslow': var a3 = tyItem(); if (a3) speak(a3.en, 0.6); break;
      case 'prshow': S.pr.show = !S.pr.show; render(); break;
      case 'prhint': S.pr.hints++; render(); break;
      case 'predit': S.pr.editKo = !S.pr.editKo; render(); break;
      case 'preditsave': prEditSave(); break;
      case 'preditcancel': S.pr.editKo = false; render(); break;
      case 'prcheck': tyCheck(); break;
      case 'prretry': var keepKind = S.pr.kind; prReset(); S.pr.retry = true; S.pr.kind = keepKind; render(); break;
      case 'prprev': prMove(-1); break;
      case 'prnext': prMove(1); break;
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target, id = t.id;
    if (id === 'prIn' && S.pr) {
      var p = S.pr, ti = prCur();
      if (!p.start && t.value) p.start = Date.now(); // 첫 글자를 친 순간부터 시간 잼
      p.input = t.value;
      // 마지막 글자까지 맞게 치면 바로 채점
      if (ti && norm(p.input) && norm(p.input) === norm(plainEn(ti.en))) tyCheck(); // 표기 차이는 Enter로 채점 (치는 중에 너무 일찍 채점되지 않게)
      else prLiveUpdate();
    }
    else if (id === 'q') { S.q = t.value; hideOkMsg(); }
    else if (id === 'bulk') { S.bulkText = t.value; hideOkMsg(); }
    else if (id === 'tblIn') { S.tbl.text = t.value; hideOkMsg(); }
    else if (t.dataset && t.dataset.tr != null) { var tr = S.tbl.rows[Number(t.dataset.tr)]; if (tr) tr[t.dataset.tc] = t.value; }
    else if (id === 'foundKo') S.foundKo = t.value;
    else if (id === 'foundMemo') S.foundMemo = t.value;
    else if (t.dataset && t.dataset.f) { S.form[t.dataset.f] = t.value; hideOkMsg(); }
    else if (t.dataset && t.dataset.list === 'q') { S.search = t.value; S.page = 1; renderListBody(); }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.set === 'newPerDay') {
      var n = parseInt(t.value, 10);
      if (!(n >= 1)) n = 20;
      if (n > 200) n = 200;
      S.settings.newPerDay = n; saveSettings(); S.pr = null; render();
    }
    if (t.dataset && t.dataset.set === 'revOn') { S.settings.revOn = !!t.checked; saveSettings(); S.pr = null; }
    if (t.dataset && t.dataset.set === 'retention') { S.settings.retention = parseFloat(t.value) || 0.9; saveSettings(); S.pr = null; render(); }
    if (t.dataset && t.dataset.set === 'freezeOn') { S.settings.freezeOn = !!t.checked; saveSettings(); }
    if (t.dataset && t.dataset.set === 'zoom') { S.settings.zoom = parseFloat(t.value) || 0.9; saveSettings(); render(); }
    if (t.dataset && t.dataset.set === 'autoSpeak') { S.settings.autoSpeak = !!t.checked; saveSettings(); }
    if (t.dataset && t.dataset.file === 'import' && t.files && t.files[0]) { importFile(t.files[0]); t.value = ''; }
    if ((t.id === 'photo-cam' || t.id === 'photo-pick') && t.files && t.files[0]) {
      handlePhoto(t.files[0]);
      try { t.value = ''; } catch (err) {}
    }
    if (t.id === 'photo-mode') S.photoMode = t.value;
    if (t.id === 'tbl-pick' && t.files && t.files[0]) { handleTableImage(t.files[0]); try { t.value = ''; } catch (err) {} }
  });

  // 표 붙여넣기 칸에 붙여 넣을 때
  document.addEventListener('paste', function (e) {
    var t = e.target;
    var onTable = S.tab === 'add' && S.addType === 'word' && S.wordMode === 'table';
    // 미리보기 칸을 고치는 중이면 보통 붙여넣기
    if (!onTable || !e.clipboardData || (t && t.dataset && t.dataset.tr != null)) return;
    var cd = e.clipboardData, file = null, i;
    for (i = 0; cd.items && i < cd.items.length; i++) {
      if (cd.items[i].kind === 'file' && /^image\//.test(cd.items[i].type)) { file = cd.items[i].getAsFile(); break; }
    }
    if (!file && cd.files && cd.files.length && /^image\//.test(cd.files[0].type)) file = cd.files[0];
    if (file) { e.preventDefault(); handleTableImage(file); return; }
    var html = cd.getData('text/html'), rows = html ? rowsFromHTML(html) : null;
    if (!rows) rows = rowsFromText(cd.getData('text/plain'));
    if (!rows || !rows.length) return; // 읽을 게 없으면 그냥 붙여넣기
    e.preventDefault();
    S.tbl.text = '';
    tblAdd(mapRows(rows), '붙여 넣은 표에서');
  });

  // 엔터: 단어 찾기 / 정답 확인
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    var typing = t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) && !t.disabled;
    if (S.tab === 'practice' && S.pr && !e.isComposing && (S.settings.prMode || 'today') !== 'match' && !S.pr.summary) {
      var p = S.pr;
      // 뜻 수정 칸: Enter 저장, Esc 취소
      if (t && (t.id === 'prEditKo' || t.id === 'prEditKeyKo')) {
        if (e.key === 'Enter') { e.preventDefault(); prEditSave(); }
        else if (e.key === 'Escape') { e.preventDefault(); p.editKo = false; render(); }
        return;
      }
      // 숫자 단축키 5~9, 0: 듣기·문장 보기·힌트·뜻 수정
      // 타이핑 칸에서도 되지만, 정답에 숫자가 있으면 숫자를 쳐야 하니 그땐 Alt+숫자만
      if (/^(Digit|Numpad)[05-9]$/.test(e.code || '') && !e.ctrlKey && !e.metaKey && (!typing || t.id === 'prIn')) {
        var ci0 = prCur(), dg = e.code.slice(-1);
        var needDigits = ci0 && /[0-9]/.test(plainEn(ci0.en));
        if (ci0 && (!typing || e.altKey || !needDigits)) {
          e.preventDefault();
          if (t && t.id === 'prIn') p.input = t.value;
          if (dg === '5' && canSpeak) speak(ci0.en);
          else if (dg === '6' && canSpeak && p.kind !== 'rev') speak(prKeyText(ci0));
          else if (dg === '7' && canSpeak) speak(ci0.en, 0.6);
          else if (dg === '8' && p.kind !== 'rev' && !p.checked) { p.show = !p.show; render(); }
          else if (dg === '9' && p.kind !== 'rev' && !p.checked && p.hints < words(ci0.en).length) { p.hints++; render(); }
          else if (dg === '0') { p.editKo = !p.editKo; render(); }
          return;
        }
      }
      // 어디서든: Ctrl+Space 듣기, Ctrl+Z 되돌리기(입력칸에 글자가 있으면 글자 되돌리기), Esc 모르겠음
      if ((e.ctrlKey || e.metaKey) && (e.key === ' ' || e.code === 'Space')) { e.preventDefault(); var ci = prCur(); if (ci) speak(ci.en); return; }
      if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && !(typing && t.value)) { e.preventDefault(); prUndo(); return; }
      if (e.key === 'Escape' && p.kind !== 'rev' && !p.checked) { e.preventDefault(); if (t && t.id === 'prIn') p.input = t.value; tyCheck(); return; }
      if (!typing) {
        if (/^[1-4]$/.test(e.key) && (p.checked || p.revealed) && !p.retry) { e.preventDefault(); gradeAndNext(Number(e.key)); return; }
        if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey && (p.checked || p.kind === 'rev')) { e.preventDefault(); prEnter(); return; }
      }
    }
    if (e.key !== 'Enter' || e.isComposing) return;
    // Ctrl(맥은 ⌘) + Enter: 추가 화면에서 바로 저장
    if ((e.ctrlKey || e.metaKey) && S.tab === 'add') {
      if (t && t.dataset && t.dataset.f) { e.preventDefault(); S.form[t.dataset.f] = t.value; saveSentence(); return; }
      if (t && (t.id === 'foundKo' || t.id === 'foundMemo') && S.found) {
        e.preventDefault();
        if (t.id === 'foundKo') S.foundKo = t.value; else S.foundMemo = t.value;
        saveFound(!!S.found.existingId); return;
      }
    }
    if (t && t.id === 'prIn') { e.preventDefault(); if (S.pr && t.value.trim()) { S.pr.input = t.value; tyCheck(); } }
    else if (t && t.id === 'q') { e.preventDefault(); S.q = t.value; lookup(); }
  });

  render();
  setSync(SY.token ? 'ok' : 'off');
  if (SY.token) syncNow(); // 앱을 열면 다른 기기 데이터를 먼저 받아옴
})();
</script>
</body>
</html>
